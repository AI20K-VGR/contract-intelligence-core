name: Backend CI

on:
  push:
    branches: [main, feature/**]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  # Every PR into develop or main, whatever the branch name (fix/*, docs/*, …):
  # before, only feature/** pushes and PRs into main ran backend CI.
  pull_request:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

env:
  UV_PROJECT_ENVIRONMENT: .venv

jobs:
  # ---------------------------------------------------------------------------
  # Layer Conformance — import-linter (Dependency Rule)
  # ---------------------------------------------------------------------------
  lint-layers:
    name: Layer Conformance (import-linter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run import-linter
        run: uv run python -m import_linter --config .importlinter

  # ---------------------------------------------------------------------------
  # Lint + Format
  # ---------------------------------------------------------------------------
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

  # ---------------------------------------------------------------------------
  # Type check
  # ---------------------------------------------------------------------------
  typecheck:
    name: MyPy Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run mypy
        run: uv run mypy src/

  # ---------------------------------------------------------------------------
  # Unit Tests
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install test dependencies
        run: uv sync --frozen --extra dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Run architecture tests (layer conformance)
        run: uv run pytest tests/architecture/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Integration Tests — Auth flow với SQLite in-memory
  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration Tests (Auth endpoints)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Real PostgreSQL for the tests sqlite cannot reach (append-only triggers,
    # LISTEN/NOTIFY, JSON share filter, alembic upgrade head). Disposable.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CI_TEST_POSTGRES_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/ci_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install test dependencies
        run: uv sync --frozen --extra dev

      - name: Run integration tests (SQLite + PostgreSQL)
        run: uv run pytest tests/integration/ -v --tb=short
