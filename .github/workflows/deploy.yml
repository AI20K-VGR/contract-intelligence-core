# Deploy `develop` to the online server over SSH, then check it from outside.
#
# Runs on every push to develop (i.e. after a PR is merged) and on demand
# ("Run workflow" deploys the branch it is started from).
# The server is prepared once by hand (deploy/README.md, steps 1-3): clone in
# /opt/contract-intelligence, deploy/bootstrap.sh, deploy/.env.prod and
# ai-service/.env filled in. This workflow only updates and restarts it.
#
# Repository secrets:
#   DEPLOY_HOST         server address (IP or name)
#   DEPLOY_USER         SSH user (root, or a user with passwordless sudo)
#   DEPLOY_SSH_KEY      private key whose public half is in that user's authorized_keys
#   DEPLOY_KNOWN_HOSTS  the server's line(s) from `ssh-keyscan -t ed25519 <host>`,
#                       checked by hand once, so the runner never trusts an unknown host
#   DEPLOY_DB_PUBLIC_IP optional: public IP of a DB server of its own; the check
#                       from outside then also proves its database ports closed
# Without DEPLOY_HOST the job reports "not configured" and succeeds.
#
# AWS server whose security group admits SSH from the operator only
# (docs/DOC-15-cicd-github-actions.md): set the repository VARIABLES
#   DEPLOY_SECURITY_GROUP_ID  the app server's security group, e.g. sg-070e3d258f1793c3e
#   DEPLOY_AWS_REGION         its region, e.g. ap-southeast-2
# and the secrets AWS_DEPLOY_ACCESS_KEY_ID / AWS_DEPLOY_SECRET_ACCESS_KEY of an
# IAM user that may only add and remove rules on that group. The job then
# opens port 22 to this runner's IP alone and closes it again at the end, even
# when the deploy fails. Without DEPLOY_SECURITY_GROUP_ID nothing changes.
#
# Hosts behind Cloudflare's proxy: set the repository variable
# DEPLOY_BEHIND_CLOUDFLARE=true (DEPLOY_HOST must then be the server's IP), so
# the check from outside probes the server, not Cloudflare.
#
# Who may deploy is decided by the "production" environment, not by this file
# (deploy/README.md, "Duyệt trước khi deploy").
name: deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of interrupting a build.
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Approval gate: when the "production" environment has required reviewers
    # (repo Settings → Environments), the job waits for one of them. Until an
    # admin adds that rule the job starts at once, as before.
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      APP_DIR: /opt/contract-intelligence
    steps:
      - name: Is a server configured?
        id: target
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::DEPLOY_HOST is not set: nothing deployed (see .github/workflows/deploy.yml)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.target.outputs.configured == 'true'

      - name: Open SSH to this runner only (AWS security group)
        id: ssh_window
        if: steps.target.outputs.configured == 'true' && vars.DEPLOY_SECURITY_GROUP_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.DEPLOY_AWS_REGION }}
          SG: ${{ vars.DEPLOY_SECURITY_GROUP_ID }}
        run: bash deploy/ssh_window.sh open "$SG"

      - name: SSH key and pinned host key
        if: steps.target.outputs.configured == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          CONFIG

      - name: Update the checkout and run deploy/deploy.sh
        if: steps.target.outputs.configured == 'true'
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          ssh server "APP_DIR='$APP_DIR' SHA='$SHA' BRANCH='$BRANCH' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo=""; [ "$(id -u)" -eq 0 ] || sudo="sudo"
          cd "$APP_DIR"
          $sudo git fetch --quiet origin "$BRANCH"
          $sudo git checkout --quiet "$BRANCH"
          # Fast-forward only: a server checkout that diverged is a problem to look at, not to overwrite.
          $sudo git merge --ff-only "$SHA"
          $sudo deploy/deploy.sh
          REMOTE

      - name: Check from outside the server
        if: steps.target.outputs.configured == 'true'
        env:
          DB_PUBLIC_IP: ${{ secrets.DEPLOY_DB_PUBLIC_IP }}
          # Behind Cloudflare the hostnames resolve to Cloudflare: probe the
          # ports on the server itself (DEPLOY_HOST is its IP).
          ORIGIN_IP: ${{ vars.DEPLOY_BEHIND_CLOUDFLARE == 'true' && secrets.DEPLOY_HOST || '' }}
        run: |
          hosts=$(ssh server "sudo=''; [ \"\$(id -u)\" -eq 0 ] || sudo=sudo; \$sudo grep -E '^(API_HOST|AUTH_HOST|APP_HOST)=' '$APP_DIR/deploy/.env.prod'")
          value() { printf '%s\n' "$hosts" | grep -E "^$1=" | tail -1 | cut -d= -f2-; }
          bash deploy/check_external.sh "$(value API_HOST)" "$(value AUTH_HOST)" "$(value APP_HOST)" "$DB_PUBLIC_IP"

      # Last step, and after a failure too: the rule opened above must not stay.
      - name: Close SSH again (AWS security group)
        if: always() && steps.ssh_window.outcome != 'skipped' && steps.ssh_window.outcome != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.DEPLOY_AWS_REGION }}
          SG: ${{ vars.DEPLOY_SECURITY_GROUP_ID }}
        run: bash deploy/ssh_window.sh close "$SG"
