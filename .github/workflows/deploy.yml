# =============================================================================
# Deploy the exact develop commit after it is pushed (including a PR merge).
# See deploy/README.md ("Cập nhật", "Staging").
#
# Pull requests into develop run only the `preflight` job (policy + deploy
# tests); nothing deploys on a PR. A push to develop deploys to staging first
# when the repository variable STAGING_ENABLED is "true", and to production only
# once staging succeeded (or was skipped because STAGING_ENABLED is not "true").
#
# Manual dispatch (Actions -> deploy -> Run workflow, or
# `gh workflow run deploy.yml --ref <branch> -f target=staging`):
#   target=production  only from develop
#   target=staging     from any branch: try a PR's branch on staging before merge
#
# The steps of one deployment live in deploy-target.yml, which also lists the
# secrets and variables of each target.
#
# Server: prepared once by hand (deploy/README.md steps 1-3): clone in
# /opt/contract-intelligence, deploy/bootstrap.sh, deploy/.env.prod and
# ai-service/.env filled in. This workflow only updates and restarts it.
#
# Production settings (repository secrets, required unless noted):
#   DEPLOY_HOST                  server address (IP or name)
#   DEPLOY_USER                  SSH user (root, or one with passwordless sudo)
#   DEPLOY_SSH_KEY               private key whose public half is in authorized_keys
#   DEPLOY_KNOWN_HOSTS           `ssh-keyscan -t ed25519 <host>` line(s), checked by
#                                hand once, so the runner never trusts an unknown host
#   DEPLOY_DB_PUBLIC_IP          (optional) DB server address; the external check
#                                asserts its Postgres ports are closed to the Internet
#   AWS_DEPLOY_ACCESS_KEY_ID /
#   AWS_DEPLOY_SECRET_ACCESS_KEY (only with DEPLOY_SECURITY_GROUP_ID) IAM key that may
#                                open/close port 22 for this runner on that group
# Repository variables:
#   DEPLOY_SECURITY_GROUP_ID     (optional) AWS security group; enables the
#                                open/close-SSH steps. Unset = those steps are skipped
#   DEPLOY_AWS_REGION            region of that group
#   DEPLOY_BEHIND_CLOUDFLARE     "true" when the hostnames sit behind Cloudflare: the
#                                external check then probes DEPLOY_HOST directly and
#                                asserts 80/443 refuse non-Cloudflare callers
#   STAGING_ENABLED              "true": a push to develop goes through staging first
#
# Who may deploy is decided by the "production" environment, not by this file
# (deploy/README.md, "Duyệt trước khi deploy"; DOC-15).
# =============================================================================
name: deploy

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      target:
        description: "production (develop only) or staging (any branch)"
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject refs outside develop before production is in scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          TARGET: ${{ inputs.target }}
        run: |
          TARGET=${TARGET:-production}
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$BASE_REF" != "develop" ]]; then
              echo "::error::Validation is allowed only for PRs targeting develop (got $BASE_REF)."
              exit 1
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$TARGET" == "staging" ]]; then
            # Staging exists to try a branch before it is merged.
            echo "Staging deployment of $REF."
          else
            if [[ "$TARGET" != "production" ]]; then
              echo "::error::Unknown deployment target: $TARGET."
              exit 1
            fi
            if [[ "$REF" != "refs/heads/develop" ]]; then
              echo "::error::Deployment is allowed only from refs/heads/develop (got $REF)."
              exit 1
            fi
            if [[ "$EVENT_NAME" != "push" && "$EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "::error::Unsupported deployment event: $EVENT_NAME."
              exit 1
            fi
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate deploy readiness and workflow policy
        run: |
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'PyYAML==6.0.3'
          python -m pytest deploy/tests/test_keycloak_configure.py -q

  # Staging first: a build that does not come up there never reaches production.
  staging:
    needs: preflight
    if: >-
      needs.preflight.result == 'success' && github.event_name != 'pull_request' &&
      (inputs.target == 'staging' || (github.event_name == 'push' && vars.STAGING_ENABLED == 'true'))
    uses: ./.github/workflows/deploy-target.yml
    with:
      target: staging
    secrets: inherit

  deploy:
    needs: [preflight, staging]
    # !cancelled(): run when staging was skipped (not enabled), not only when it passed.
    if: >-
      !cancelled() && needs.preflight.result == 'success' && github.event_name != 'pull_request' &&
      inputs.target != 'staging' &&
      (needs.staging.result == 'success' || needs.staging.result == 'skipped')
    uses: ./.github/workflows/deploy-target.yml
    with:
      target: production
    secrets: inherit
