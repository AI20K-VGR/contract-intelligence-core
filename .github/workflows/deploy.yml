# =============================================================================
# Deploy the exact develop commit after it is pushed (including a PR merge).
# Manual dispatch is supported only from develop. See deploy/README.md.
# =============================================================================
name: deploy

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject refs outside develop before production is in scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$BASE_REF" != "develop" ]]; then
              echo "::error::Validation is allowed only for PRs targeting develop (got $BASE_REF)."
              exit 1
            fi
          else
            if [[ "$REF" != "refs/heads/develop" ]]; then
              echo "::error::Deployment is allowed only from refs/heads/develop (got $REF)."
              exit 1
            fi
            if [[ "$EVENT_NAME" != "push" && "$EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "::error::Unsupported deployment event: $EVENT_NAME."
              exit 1
            fi
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate deploy readiness and workflow policy
        run: |
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'PyYAML==6.0.3'
          python -m pytest deploy/tests/test_keycloak_configure.py -q

  deploy:
    needs: preflight
    if: needs.preflight.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      APP_DIR: /opt/contract-intelligence
    steps:
      - name: Require complete SSH configuration
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            value=${!name-}
            if [[ -z "$value" ]]; then
              echo "::error::Required deployment setting $name is missing."
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            exit 1
          fi
          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ || ! "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::DEPLOY_HOST or DEPLOY_USER contains unsupported characters."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install SSH identity and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          CONFIG

      - name: Deploy the exact triggering SHA
        env:
          SHA: ${{ github.sha }}
        run: |
          ssh server "APP_DIR='$APP_DIR' SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo=""; [ "$(id -u)" -eq 0 ] || sudo="sudo"
          cd "$APP_DIR"
          if ! $sudo git diff --quiet || ! $sudo git diff --cached --quiet || [ -n "$($sudo git ls-files --others --exclude-standard)" ]; then
            echo "deployment checkout has local changes; refusing to deploy over them" >&2
            exit 1
          fi
          $sudo git fetch --quiet origin "$SHA"
          $sudo git checkout --detach "$SHA"
          deployed_sha=$($sudo git rev-parse HEAD)
          [ "$deployed_sha" = "$SHA" ] || { echo "deploy SHA mismatch" >&2; exit 1; }
          $sudo deploy/deploy.sh
          deployed_sha=$($sudo git rev-parse HEAD)
          [ "$deployed_sha" = "$SHA" ] || { echo "deploy source changed during release" >&2; exit 1; }
          REMOTE

      - name: Check HTTPS, authentication, and external exposure
        run: |
          hosts=$(ssh server "sudo=''; [ \"\$(id -u)\" -eq 0 ] || sudo=sudo; \$sudo grep -E '^(API_HOST|AUTH_HOST|APP_HOST)=' '$APP_DIR/deploy/.env.prod'")
          value() { printf '%s\n' "$hosts" | grep -E "^$1=" | tail -1 | cut -d= -f2-; }
          api_host=$(value API_HOST)
          auth_host=$(value AUTH_HOST)
          app_host=$(value APP_HOST)
          [[ -n "$api_host" && -n "$auth_host" ]] || { echo "::error::API_HOST or AUTH_HOST is missing in deploy/.env.prod"; exit 1; }
          bash deploy/check_external.sh "$api_host" "$auth_host" "$app_host"
