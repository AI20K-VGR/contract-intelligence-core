# CI for apps/web (React + TypeScript). frontend/ is the old superseded placeholder.
# Ask the mentor to make it a required check when it is stable.
name: frontend

on:
  pull_request:
    paths: ["apps/web/**"]
  push:
    branches: [develop, main]
    paths: ["apps/web/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: TODO (team) — add lint/test script once defined
        run: npm run build
