# {from: P1, to: P2} means P1 is prerequisite of P2.
# Shared files are sequential handoffs under one module owner; no parallel writes.
edges:
  - {from: P1, to: P2}
  - {from: P2, to: P3}
  - {from: P3, to: P4T}
  - {from: P4T, to: P4U}
  - {from: P4U, to: P5}
subtasks:
  P1:
    files_to_create:
      - evals/contract_graph/reports/quality-recovery-p1-evidence.json
      - evals/contract_graph/reports/quality-recovery-p1-evidence.md
    files_to_modify:
      - ai-service/app/pipeline/contract_graph/pair_classifier.py
      - ai-service/app/pipeline/contract_graph/pair_builder.py
      - evals/contract_graph/pairs/predictor.py
      - evals/contract_graph/pairs/recall_diagnostic.py
      - ai-service/tests/test_contract_graph_pair_classifier.py
      - ai-service/tests/test_contract_graph_pair_builder.py
      - evals/contract_graph/tests/test_cg_pairs_predictor.py
      - evals/contract_graph/tests/test_cg_pairs_recall_diagnostic.py
    post: [verification-P1.json]
  P2:
    files_to_create:
      - evals/contract_graph/tests/test_cg_pairs_run.py
      - evals/contract_graph/reports/quality-recovery-p2-gates.json
      - evals/contract_graph/reports/quality-recovery-p2-gates.md
    files_to_modify:
      - evals/contract_graph/pairs/score.py
      - evals/contract_graph/pairs/predictor.py
      - evals/contract_graph/pairs/bakeoff.py
      - evals/contract_graph/pairs/run.py
      - evals/contract_graph/tests/test_cg_pairs_score.py
      - evals/contract_graph/tests/test_cg_pairs_predictor.py
      - evals/contract_graph/tests/test_cg_pairs_bakeoff.py
    post: [verification-P2.json]
  P3:
    files_to_create:
      - evals/contract_graph/pairs/quality-recovery-manifest.v1.json
      - evals/contract_graph/reports/quality-recovery-p3-dev-corpus.json
      - evals/contract_graph/reports/quality-recovery-p3-dev-corpus.md
    files_to_modify:
      - evals/contract_graph/pairs/LABELING.vi.md
      - evals/contract_graph/pairs/corpus.py
      - evals/contract_graph/pairs/manifest.py
      - evals/contract_graph/pairs/review.py
      - evals/contract_graph/tests/test_cg_pairs_corpus.py
      - evals/contract_graph/tests/test_cg_pairs_manifest.py
      - evals/contract_graph/tests/test_cg_pairs_review.py
    post: [verification-P3.json]
  P4T:
    files_to_create:
      - evals/contract_graph/reports/quality-recovery-p4-development.json
      - evals/contract_graph/reports/quality-recovery-p4-development.md
    files_to_modify:
      - ai-service/app/pipeline/contract_graph/pair_candidates.py
      - ai-service/app/pipeline/contract_graph/pair_classifier.py
      - ai-service/app/pipeline/contract_graph/pair_builder.py
      - evals/contract_graph/pairs/candidate_eval.py
      - evals/contract_graph/pairs/predictor.py
      - ai-service/tests/test_contract_graph_pair_candidates.py
      - ai-service/tests/test_contract_graph_pair_classifier.py
      - evals/contract_graph/tests/test_cg_pairs_candidate_eval.py
    post: [verification-P4T.json]
  P5:
    files_to_create: []
    files_to_modify: []
    post: [verification-P5.json, review-decision.yaml]
  P4U:
    files_to_create: []
    files_to_modify:
      - ai-service/app/pipeline/contract_graph/pair_candidates.py
      - ai-service/app/pipeline/contract_graph/pair_builder.py
      - ai-service/app/pipeline/contract_graph/pair_projection.py
      - ai-service/tests/test_contract_graph_pair_candidates.py
      - ai-service/tests/test_contract_graph_pair_builder.py
      - ai-service/tests/test_contract_graph_pair_projection.py
      - evals/contract_graph/pairs/recall_diagnostic.py
      - evals/contract_graph/tests/test_cg_pairs_recall_diagnostic.py
    post: [verification-P4U.json]
