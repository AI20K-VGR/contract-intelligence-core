# plan-graph.yaml — phase-DAG sidecar for 260929-2323-ai2-a-measure-baseline.
# {from: A, to: B} = "A runs BEFORE B". Chain P1 -> P2 -> P3 -> P4 (P2 -> P4 explicit:
# P4's PR job calls P2's gate CLI and needs P2's committed baselines).
# P4 also runs a mechanical ruff autofix (I001/F401/E714) whose exact file list is the
# output of `ruff check` at cook time; it is scoped to files NOT owned by P1-P3 below.
edges:
  - {from: P1, to: P2}
  - {from: P2, to: P3}
  - {from: P2, to: P4}
  - {from: P3, to: P4}
