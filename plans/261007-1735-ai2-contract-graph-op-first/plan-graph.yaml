# Phase DAG sidecar for 261007-1735-ai2-contract-graph-op-first.
# {from: A, to: B} = "A runs BEFORE B". No status here (status lives in plan.md).
# idp.py is modified by P3 and P4; they are ordered (P3 -> P4), so not a parallel conflict.
