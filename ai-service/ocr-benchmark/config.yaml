render:
  dpi: 300
  format: png

paths:
  data: data
  artifacts: artifacts
  reports: reports

experiments:
  - id: raw
    preprocessing: []
  - id: preprocessed
    preprocessing: [deskew, grayscale, contrast, denoise]

mistral:
  enabled: true
  model: mistral-ocr-4
  price_per_page: null

statistics:
  bootstrap_iterations: 1000
  confidence_level: 0.95
  seed: 42
