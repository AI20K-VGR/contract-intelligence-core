# =============================================================================
# Production override — one Linux VPS behind Caddy (HTTPS).
#
#   docker compose -f docker-compose.yml -f deploy/compose.prod.yml \
#       --env-file deploy/.env.prod up -d --build
#
# (deploy/deploy.sh wraps this.) What changes against the local stack:
#
#   - Only Caddy publishes ports (80/443). Postgres, Kafka, MinIO, AI2 and
#     Keycloak are reachable only on ci-network (mentor: AI2 not on the Internet).
#   - Public hosts: https://$API_HOST → backend:8000,
#                   https://$AUTH_HOST → keycloak:8080 (admin console blocked).
#   - Every secret comes from deploy/.env.prod (generated by bootstrap.sh);
#     `${VAR:?}` makes compose refuse to start when one is missing.
#   - Keycloak runs `start` (production mode) with its public hostname, so
#     tokens carry iss=https://$AUTH_HOST/realms/contract-intelligence.
#   - No source bind-mounts: images run the code they were built with.
#   - AI1 → backend stays Kafka, backend → AI2 stays HTTP, both internal.
#   - Monitoring: Grafana is served at https://$API_HOST/grafana/ by the
#     backend (ADMINISTRATOR only). Grafana, Prometheus, node-exporter and
#     cAdvisor publish no port and sit on the internal ci-monitoring network.
#
# Needs Docker Compose >= 2.24 (`!reset`).
# =============================================================================

services:
  keycloak-db:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in deploy/.env.prod}

  keycloak:
    command: !override
      - start
      - --import-realm
      - --health-enabled=true
      - --http-enabled=true
      - --proxy-headers=xforwarded
      - --hostname=https://${AUTH_HOST:?set in deploy/.env.prod}
      - --hostname-backchannel-dynamic=true
      # Admin console only through an SSH tunnel to localhost:8080 (deploy/README.md).
      - --hostname-admin=http://localhost:8080
    environment:
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in deploy/.env.prod}
      KC_HOSTNAME: https://${AUTH_HOST:?set in deploy/.env.prod}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in deploy/.env.prod}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in deploy/.env.prod}
      # Keycloak → backend user-sync webhook over the internal network.
      WEBHOOK_URI: http://backend:8000/api/v1/auth/webhooks/keycloak
      WEBHOOK_SECRET: ${KEYCLOAK_WEBHOOK_SECRET:?set in deploy/.env.prod}
      KC_LOG_LEVEL: INFO
      KC_SPI_THEME_CACHE_THEMES: "true"
      KC_SPI_THEME_CACHE_TEMPLATES: "true"
    ports: !reset []
    # Theme is baked into the image; keep only the realm import.
    volumes: !override
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  backend-db:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD:?set in deploy/.env.prod}

  kafka:
    ports: !reset []
    environment:
      # Internal listeners only; no host (EXTERNAL) listener.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx512m -Xms512m}

  backend:
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://ci:${BACKEND_DB_PASSWORD:?set in deploy/.env.prod}@backend-db:5432/contract_intelligence
      AI2_DB_PASSWORD: ${AI2_DB_PASSWORD:?set in deploy/.env.prod}
      # Tokens are minted through the public hostname.
      KEYCLOAK_SERVER_URL: https://${AUTH_HOST:?set in deploy/.env.prod}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${BACKEND_KEYCLOAK_ADMIN_SECRET:?set in deploy/.env.prod}
      KEYCLOAK_WEBHOOK_SECRET: ${KEYCLOAK_WEBHOOK_SECRET:?set in deploy/.env.prod}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set in deploy/.env.prod}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set in deploy/.env.prod}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set in deploy/.env.prod}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set in deploy/.env.prod}
      AI2_SERVICE_HMAC_SECRET: ${AI2_SERVICE_HMAC_SECRET:?set in deploy/.env.prod}
      CORS_ALLOW_ORIGINS: ${FRONTEND_ORIGINS:?set in deploy/.env.prod}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?set in deploy/.env.prod}
      # Caddy is another container: trust its X-Forwarded-* headers.
      FORWARDED_ALLOW_IPS: "*"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MONITORING_SESSION_SECRET: ${MONITORING_SESSION_SECRET:?set in deploy/.env.prod}
      MONITORING_COOKIE_SAMESITE: ${MONITORING_COOKIE_SAMESITE:-none}
      MONITORING_COOKIE_SECURE: "true"
    ports: !reset []
    volumes: !reset []

  backend-worker:
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://ci:${BACKEND_DB_PASSWORD:?set in deploy/.env.prod}@backend-db:5432/contract_intelligence
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set in deploy/.env.prod}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set in deploy/.env.prod}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set in deploy/.env.prod}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set in deploy/.env.prod}
      AI2_SERVICE_HMAC_SECRET: ${AI2_SERVICE_HMAC_SECRET:?set in deploy/.env.prod}
    volumes: !reset []

  # AI1 reads and writes MinIO only through presigned URLs from the backend.
  ai1-worker:
    volumes: !reset []

  ai2-service:
    environment:
      AI2_LLM_BASE_URL: ${AI2_LLM_BASE_URL:?set the LLM provider in deploy/.env.prod}
      AI2_LLM_API_KEY: ${AI2_LLM_API_KEY:-}
      AI2_LLM_MODEL: ${AI2_LLM_MODEL:-gpt-4o-mini}
      AI2_LLM_STRONG_MODEL: ${AI2_LLM_STRONG_MODEL:-gpt-4o-mini}
      AI2_SERVICE_HMAC_SECRET: ${AI2_SERVICE_HMAC_SECRET:?set in deploy/.env.prod}
    # Internal only — the backend reaches it as http://ai2-service:8002.
    ports: !reset []

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in deploy/.env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in deploy/.env.prod}
    ports: !reset []

  minio-init:
    entrypoint: !override
      - /bin/sh
      - -c
      - >-
        until /usr/bin/mc alias set myminio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        do echo 'waiting for minio...'; sleep 1; done;
        /usr/bin/mc mb --ignore-existing myminio/dossiers;
        /usr/bin/mc mb --ignore-existing myminio/ci-render;
        /usr/bin/mc anonymous set private myminio/dossiers;
        /usr/bin/mc anonymous set private myminio/ci-render
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in deploy/.env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in deploy/.env.prod}

  # Catches invitation / reset e-mails when no real SMTP is configured.
  # No public port: read it through an SSH tunnel (see deploy/README.md).
  mailpit:
    profiles: !reset []
    ports: !reset []

  grafana:
    environment:
      # Public URL of the backend's /grafana proxy (no Grafana host of its own).
      GF_SERVER_ROOT_URL: https://${API_HOST:?set in deploy/.env.prod}/grafana/
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in deploy/.env.prod}
      GF_SECURITY_COOKIE_SECURE: "true"

  node-exporter:
    # Linux host: propagate mounts made after start (Docker Desktop refuses rslave).
    volumes: !override
      - /:/host:ro,rslave

  caddy:
    image: caddy:2.8-alpine
    container_name: ci-caddy
    restart: unless-stopped
    depends_on:
      - backend
      - keycloak
    environment:
      API_HOST: ${API_HOST:?set in deploy/.env.prod}
      AUTH_HOST: ${AUTH_HOST:?set in deploy/.env.prod}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ci-network

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
