server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PDF.js loads its worker as an ES module.  nginx's default MIME table
    # serves .mjs as application/octet-stream, which browsers reject for
    # dynamic module imports.
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend"}';
    }
}
