openapi: 3.1.0

info:
  title: Contract Intelligence API
  version: 0.2.0
  status: draft — chờ mentor review (Sprint 1)
  description: |
    REST API cho Contract Intelligence — hệ thống trích xuất, so sánh và review hợp đồng.

    **Khớp kiến trúc:** `docs/DOC-04-architecture.md` (v0.1, 2026-09-16)
    **Khớp schema:** `docs/DOC-04b-postgres-schema.sql` (PostgreSQL v1.0 đã chốt 2026-09-17)

    ## Đơn vị xử lý
    - **Dossier** = 1 hợp đồng + 0..n phụ lục
    - **Job** = một lần chạy pipeline cho một dossier (có thể retry, có thể chạy lại với cấu hình mới)
    - **Pipeline run** = snapshot cấu hình của job, mang `run_id` để truy vết

    ## Quy ước chung
    - Tất cả endpoint có tiền tố `/api/v1`
    - Định dạng: JSON UTF-8, thời gian ISO 8601 kèm timezone
    - Lỗi trả về `application/problem+json` (RFC 9457) kèm `code` nội bộ và `trace_id`
    - Phân trang: cursor (`?cursor=&limit=`), mặc định limit=50, tối đa 200
    - Header phản hồi `X-Trace-Id` để debug
    - Xác thực: session cookie HttpOnly + `Idempotency-Key` cho POST
    - Tài liệu OpenAPI UI: `GET /docs` (Swagger UI), `GET /redoc`

    ## Optimistic concurrency cho review
    Mọi API trả về fact/finding/clause… ở chế độ "effective" đều kèm `current_version`.
    Khi reviewer submit action, client phải gửi `base_version`.
    Mismatch giữa `base_version` của client và version hiện tại trong DB → API trả `409 Conflict` kèm state mới nhất để client refetch/retry.

  contact:
    name: Contract Intelligence Team — VSF OJT Batch 3
    email: dev@local.test
  license:
    name: Proprietary (OJT)

servers:
  - url: http://localhost:8000/api/v1
    description: Local development (docker compose)
  - url: https://api.contractintel.internal/api/v1
    description: Internal staging (TBD)

# ═══════════════════════════════════════════════════════════════════════════
# TAGS
# ═══════════════════════════════════════════════════════════════════════════
tags:
  - name: dossiers
    description: Quản lý dossier (1 hợp đồng + phụ lục)
  - name: jobs
    description: Theo dõi job và retry
  - name: batches
    description: Upload hàng loạt và tóm tắt
  - name: documents
    description: Tài liệu trong dossier
  - name: pages
    description: Trang, ảnh, text layer
  - name: clauses
    description: Cây điều khoản
  - name: tables
    description: Bảng có cấu trúc
  - name: facts
    description: Fact (giá trị trích) + giá trị hiệu lực
  - name: findings
    description: Finding (kết quả so sánh kỹ thuật)
  - name: conflicts
    description: View lấy ra các finding cần reviewer xử lý
  - name: citations
    description: Citation (Tài liệu → Trang → Dòng OCR → Char span → BBox)
  - name: review
    description: Review item và review action (HITL)
  - name: approval
    description: Approve dossier
  - name: audit
    description: Audit trail
  - name: ops
    description: KPI vận hành (throughput, cost, failures)
  - name: health
    description: Health / readiness

# ═══════════════════════════════════════════════════════════════════════════
# PATHS
# ═══════════════════════════════════════════════════════════════════════════
paths:

  # ─── Dossiers ────────────────────────────────────────────────────────────
  /dossiers:
    post:
      tags: [dossiers]
      summary: Tạo dossier + upload file hợp đồng/phụ lục
      description: |
        Multipart upload: trường `contract` bắt buộc (1 file), trường `annexes` tuỳ chọn (0..n file).
        Operator gán vai trò bằng thứ tự upload. Toàn bộ dossier/document/job/task được tạo trong **một transaction**.
        Trả `202 Accepted` kèm `dossier_id` và `job_id`.
      operationId: createDossier
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DossierUploadRequest'
            encoding:
              contract:
                contentType: application/pdf
              annexes:
                contentType: application/pdf
              metadata:
                contentType: application/json
      responses:
        '202':
          description: Dossier accepted, processing async
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeDossierCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'

    get:
      tags: [dossiers]
      summary: Danh sách dossier
      operationId: listDossiers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/JobStatus' }
        - name: has_conflicts
          in: query
          schema: { type: boolean }
        - name: batch_id
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Tìm theo tên dossier
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Paginated dossier list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeDossierList'

  /dossiers/{dossier_id}:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    get:
      tags: [dossiers]
      summary: Chi tiết dossier (tài liệu, job mới nhất, tóm tắt)
      operationId: getDossier
      responses:
        '200':
          description: Dossier detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeDossier'
        '404':
          $ref: '#/components/responses/NotFound'

  /dossiers/{dossier_id}/reprocess:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    post:
      tags: [dossiers]
      summary: Tạo job mới cho dossier (chạy lại với cấu hình hiện tại)
      description: |
        Tạo job mới + `pipeline_run` mới, kết quả cũ vẫn còn (bất biến).
        Khi job mới chạy xong, UI sẽ hiển thị kết quả mới nhất; kết quả cũ có thể xem qua `/dossiers/{id}/audit`.
      operationId: reprocessDossier
      responses:
        '202':
          description: Reprocess accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeDossierCreated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Dossier đang có job chạy, không thể reprocess
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ─── Jobs ────────────────────────────────────────────────────────────────
  /jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [jobs]
      summary: Trạng thái job, tiến độ theo bước, lỗi, link trace
      operationId: getJob
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeJob'
        '404':
          $ref: '#/components/responses/NotFound'

  /jobs/{job_id}/retry:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [jobs]
      summary: Retry từ bước lỗi (cùng run)
      operationId: retryJob
      responses:
        '202':
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeJob'
        '409':
          description: Job không ở trạng thái failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ─── Batches ─────────────────────────────────────────────────────────────
  /batches:
    post:
      tags: [batches]
      summary: Tạo batch từ ZIP + manifest.csv
      description: |
        Manifest CSV có cột: `dossier_name, file, role, order`.
        Mỗi dossier trong batch tạo một job độc lập.
      operationId: createBatch
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [manifest, archive]
              properties:
                manifest:
                  type: string
                  format: binary
                  description: File manifest.csv
                archive:
                  type: string
                  format: binary
                  description: File ZIP chứa tất cả dossier
      responses:
        '202':
          description: Batch accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeBatchCreated'

  /batches/{batch_id}/summary:
    parameters:
      - name: batch_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [batches]
      summary: Tóm tắt batch (Done/Needs Review/Failed/In progress + chi phí)
      operationId: getBatchSummary
      responses:
        '200':
          description: Batch summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeBatchSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /batches/{batch_id}/resume:
    parameters:
      - name: batch_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [batches]
      summary: Bỏ auto_paused của batch
      operationId: resumeBatch
      responses:
        '200':
          description: Batch resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeBatchSummary'

  # ─── Documents & Pages ───────────────────────────────────────────────────
  /documents/{document_id}/pages:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [pages]
      summary: Metadata các trang (loại, kích thước, rotation, chỉ số chất lượng)
      operationId: listPages
      responses:
        '200':
          description: Page metadata list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopePageList'

  /documents/{document_id}/pages/{page_no}/image:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - name: page_no
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: variant
        in: query
        schema:
          type: string
          enum: [preview, render]
          default: preview
    get:
      tags: [pages]
      summary: Ảnh trang (PNG 300 DPI hoặc WebP preview)
      operationId: getPageImage
      responses:
        '200':
          description: Page image
          content:
            image/png: {}
            image/webp: {}
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/{document_id}/pages/{page_no}/ocr:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - name: page_no
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: level
        in: query
        schema:
          type: string
          enum: [line, word]
          default: line
      - name: run_id
        in: query
        description: Mặc định dùng latest run
        schema: { type: string }
    get:
      tags: [pages]
      summary: OCR text + bbox (line hoặc word)
      operationId: getPageOcr
      responses:
        '200':
          description: OCR data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopePageOcr'

  /documents/{document_id}/clauses:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - name: run_id
        in: query
        schema: { type: string }
    get:
      tags: [clauses]
      summary: Cây điều khoản (Điều → Khoản → Điểm) + region bbox
      operationId: getClauseTree
      responses:
        '200':
          description: Clause tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeClauseTree'

  /documents/{document_id}/tables:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - name: run_id
        in: query
        schema: { type: string }
    get:
      tags: [tables]
      summary: Bảng có cấu trúc (không flatten)
      operationId: getTables
      responses:
        '200':
          description: Tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeTableList'

  # ─── Facts ───────────────────────────────────────────────────────────────
  /dossiers/{dossier_id}/facts:
    parameters:
      - $ref: '#/components/parameters/DossierId'
      - name: effective
        in: query
        description: Nếu true, trả kèm `current_version` cho optimistic concurrency
        schema: { type: boolean, default: true }
      - name: key
        in: query
        description: Lọc theo fact key (vd. `price.total`)
        schema: { type: string }
    get:
      tags: [facts]
      summary: Danh sách fact + giá trị hiệu lực (kèm version cho concurrency)
      operationId: listFacts
      responses:
        '200':
          description: Fact list with effective values
          headers:
            ETag:
              description: ETag cho optimistic concurrency ở cấp dossier
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeFactList'

  # ─── Findings & Conflicts ────────────────────────────────────────────────
  /dossiers/{dossier_id}/findings:
    parameters:
      - $ref: '#/components/parameters/DossierId'
      - name: disposition
        in: query
        schema:
          type: string
          enum: [comparable_match, comparable_difference, candidate_amendment, not_comparable, insufficient_evidence]
      - name: scope
        in: query
        schema:
          type: string
          enum: [within_document, contract_annex, annex_annex]
    get:
      tags: [findings]
      summary: Toàn bộ finding (mọi disposition, kể cả match)
      operationId: listFindings
      responses:
        '200':
          description: Finding list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeFindingList'

  /dossiers/{dossier_id}/conflicts:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    get:
      tags: [conflicts]
      summary: Finding cần reviewer xử lý (= view v_conflict)
      operationId: listConflicts
      responses:
        '200':
          description: Conflict list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeFindingList'

  # ─── Citations ───────────────────────────────────────────────────────────
  /citations/{citation_id}:
    parameters:
      - name: citation_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [citations]
      summary: Resolve citation — trả URL ảnh trang + bbox để UI highlight một thao tác (BR-07)
      operationId: getCitation
      responses:
        '200':
          description: Citation resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeCitationResolved'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Review ──────────────────────────────────────────────────────────────
  /dossiers/{dossier_id}/review-items:
    parameters:
      - $ref: '#/components/parameters/DossierId'
      - name: status
        in: query
        schema:
          type: string
          enum: [open, awaiting_evidence, resolved]
        - name: priority
          in: query
          schema: { type: string, enum: [P1, P2, P3] }
    get:
      tags: [review]
      summary: Hàng đợi review
      operationId: listReviewItems
      responses:
        '200':
          description: Review item list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeReviewItemList'

  /review-items/{review_item_id}:
    parameters:
      - name: review_item_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [review]
      summary: Chi tiết review item (kèm version & target snapshot)
      operationId: getReviewItem
      responses:
        '200':
          description: Review item detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeReviewItem'
        '404':
          $ref: '#/components/responses/NotFound'

  /review-items/{review_item_id}/actions:
    parameters:
      - name: review_item_id
        in: path
        required: true
        schema: { type: string }
      - name: Idempotency-Key
        in: header
        required: false
        schema: { type: string, format: uuid }
    post:
      tags: [review]
      summary: Submit review action (Confirm / Correct / Reject / Needs more evidence)
      description: |
        **Optimistic concurrency bắt buộc:**
        - Client gửi `base_version` (là `current_version` đã đọc trước đó, hoặc `0` nếu dựa trên máy).
        - Nếu DB hiện đang ở version khác → API trả **`409 Conflict`** kèm state mới nhất để client refetch.
        - Trong vòng 60s sau lần submit đầu, request lặp lại với cùng `Idempotency-Key` sẽ trả cùng kết quả (retry an toàn).
        - Với `correct`, `corrected_value` hoặc `corrected_bbox` phải có (CHECK constraint).
      operationId: submitReviewAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewActionRequest'
      responses:
        '200':
          description: Action recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeReviewAction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Revision conflict — concurrent update detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeReviewConflict'

  # ─── Approval ────────────────────────────────────────────────────────────
  /dossiers/{dossier_id}/approve:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    post:
      tags: [approval]
      summary: Approve dossier (chỉ khi job ở reviewed, mọi review item đã xử lý)
      operationId: approveDossier
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: Dossier approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeDossier'
        '409':
          description: Preconditions not met
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ─── Audit & Export ──────────────────────────────────────────────────────
  /dossiers/{dossier_id}/audit:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    get:
      tags: [audit]
      summary: Dòng thời gian job_event + review_action + approval
      operationId: getAuditTrail
      responses:
        '200':
          description: Audit trail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeAudit'

  /dossiers/{dossier_id}/export:
    parameters:
      - $ref: '#/components/parameters/DossierId'
      - name: run_id
        in: query
        schema: { type: string }
    get:
      tags: [dossiers]
      summary: Export JSON kết quả máy + giá trị hiệu lực
      operationId: exportDossier
      responses:
        '200':
          description: Export JSON (gzip được)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeExport'

  # ─── Ops ─────────────────────────────────────────────────────────────────
  /ops/summary:
    parameters:
      - name: from
        in: query
        schema: { type: string, format: date-time }
      - name: to
        in: query
        schema: { type: string, format: date-time }
    get:
      tags: [ops]
      summary: KPI throughput, cost, failure (NFR-02/03)
      operationId: getOpsSummary
      responses:
        '200':
          description: Ops summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOpsSummary'

  # ─── Health ──────────────────────────────────────────────────────────────
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: healthz
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe (DB + data dir)
      operationId: readyz
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Not ready (DB down, disk full, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'

# ═══════════════════════════════════════════════════════════════════════════
# COMPONENTS
# ═══════════════════════════════════════════════════════════════════════════
components:

  # ── Headers ──────────────────────────────────────────────────────────────
  headers:
    TraceId:
      description: ID trace OpenTelemetry (hex 32 ký tự)
      schema: { type: string, pattern: "^[0-9a-f]{32}$" }

  # ── Parameters ───────────────────────────────────────────────────────────
  parameters:
    DossierId:
      name: dossier_id
      in: path
      required: true
      schema: { type: string, pattern: "^dos_[0-9A-HJKMNP-TV-Z]{26}$" }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, pattern: "^job_[0-9A-HJKMNP-TV-Z]{26}$" }
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: { type: string, pattern: "^doc_[0-9A-HJKMNP-TV-Z]{26}$" }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  # ── Schemas ──────────────────────────────────────────────────────────────
  schemas:

    # ── Problem Details (RFC 9457) ──────────────────────────────────────────
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: |
            Mã lỗi nội bộ (xem DOC-04 mục 8.6).
            Ví dụ: `PDF_INVALID`, `OCR_RATE_LIMITED`, `DB_ERROR`, `INTERNAL_ERROR`.
        detail: { type: string }
        instance: { type: string }
        trace_id:
          type: string
          description: ID trace OpenTelemetry để debug

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              ok: { type: boolean }
              detail: { type: string }

    # ── Shared enums ───────────────────────────────────────────────────────
    JobStatus:
      type: string
      enum: [uploaded, processing, extracted, pending_review, reviewed, approved, failed]
      description: Trạng thái job (BRD §14)

    PageKind:
      type: string
      enum: [native, scanned, hybrid]

    Disposition:
      type: string
      enum:
        - comparable_match
        - comparable_difference
        - candidate_amendment
        - not_comparable
        - insufficient_evidence

    Severity:
      type: string
      enum: [high, medium, low]

    FindingType:
      type: string
      enum: [structured, semantic]

    FindingScope:
      type: string
      enum: [within_document, contract_annex, annex_annex]

    ReviewActionType:
      type: string
      enum: [confirm, correct, reject, needs_more_evidence]

    ReviewItemStatus:
      type: string
      enum: [open, awaiting_evidence, resolved]

    ReviewItemPriority:
      type: string
      enum: [P1, P2, P3]

    TargetType:
      type: string
      enum: [fact, finding, annex_link, clause_node, table_cell, citation]

    # ── Geometry ───────────────────────────────────────────────────────────
    BBox:
      type: object
      description: Canonical Page Space (CPS) — `[x0,y0,x1,y1]` chuẩn hóa 0..1
      required: [x0, y0, x1, y1]
      properties:
        x0: { type: number, minimum: 0, maximum: 1 }
        y0: { type: number, minimum: 0, maximum: 1 }
        x1: { type: number, minimum: 0, maximum: 1 }
        y1: { type: number, minimum: 0, maximum: 1 }

    BBoxLevel:
      type: string
      enum: [word_union, line, clause_region]

    BBoxSource:
      type: string
      enum: [native, detector, estimated, human]

    CoordSystem:
      type: object
      required: [space, range, origin, format]
      properties:
        space: { type: string, enum: [CPS] }
        range: { type: string, enum: ["0..1"] }
        origin: { type: string, enum: ["top-left"] }
        format: { type: string, enum: ["x0,y0,x1,y1"] }

    # ── Dossier ────────────────────────────────────────────────────────────
    Dossier:
      type: object
      required: [id, name, has_conflicts, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        batch_id: { type: string, nullable: true }
        has_conflicts: { type: boolean }
        latest_job_id: { type: string, nullable: true }
        latest_job_status: { $ref: '#/components/schemas/JobStatus' }
        documents:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        open_review_items: { type: integer, description: Tổng review_item chưa resolved }
        pending_conflicts: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DossierSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        batch_id: { type: string, nullable: true }
        has_conflicts: { type: boolean }
        latest_job_status: { $ref: '#/components/schemas/JobStatus' }
        open_review_items: { type: integer }
        pending_conflicts: { type: integer }
        created_at: { type: string, format: date-time }

    DossierUploadRequest:
      type: object
      required: [contract, metadata]
      properties:
        contract:
          type: string
          format: binary
          description: File PDF hợp đồng chính
        annexes:
          type: array
          items: { type: string, format: binary }
          description: Các file PDF phụ lục theo thứ tự
        metadata:
          type: object
          description: |
            JSON object. Khuyến nghị: `{"name": "...", "tags": [...], "notes": "..."}`.
            Tên nếu thiếu sẽ lấy từ file hợp đồng.

    # ── Document & Pages ───────────────────────────────────────────────────
    Document:
      type: object
      properties:
        id: { type: string }
        dossier_id: { type: string }
        role: { type: string, enum: [contract, annex] }
        order_index: { type: integer }
        filename: { type: string }
        sha256: { type: string }
        page_count: { type: integer }
        lang_detected: { type: string, nullable: true }
        annex_link_status:
          $ref: '#/components/schemas/AnnexLinkStatus'
          nullable: true

    AnnexLinkStatus:
      type: string
      enum: [linked, linked_needs_review, unlinked]

    Page:
      type: object
      properties:
        id: { type: string }
        document_id: { type: string }
        page_no: { type: integer }
        kind: { $ref: '#/components/schemas/PageKind' }
        width_pt: { type: number }
        height_pt: { type: number }
        rotation: { type: integer, enum: [0, 90, 180, 270] }
        render_dpi: { type: integer }
        preview_uri: { type: string, nullable: true }
        render_uri: { type: string, nullable: true }
        quality:
          type: object
          additionalProperties: true
          description: 'Chỉ số chất lượng: blur_score, skew_deg, contrast, ...'

    PageOcrLine:
      type: object
      properties:
        line_id: { type: string }
        line_no: { type: integer }
        text: { type: string }
        bbox: { $ref: '#/components/schemas/BBox' }
        bbox_source: { $ref: '#/components/schemas/BBoxSource' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        flags:
          type: object
          properties:
            numeric_mismatch: { type: boolean }
            unaligned: { type: boolean }
            region: { type: string, enum: [body, header, footer, table] }
        char_span_doc: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }

    PageOcr:
      type: object
      properties:
        page_id: { type: string }
        run_id: { type: string }
        kind: { $ref: '#/components/schemas/PageKind' }
        cps:
          type: object
          properties:
            width_pt: { type: number }
            height_pt: { type: number }
            rotation: { type: integer }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PageOcrLine' }

    # ── Clauses ────────────────────────────────────────────────────────────
    ClauseNode:
      type: object
      properties:
        id: { type: string }
        document_id: { type: string }
        node_type: { type: string, enum: [annex, article, clause, point, preamble, signature_block] }
        label: { type: string, description: 'VD: "Điều 5"' }
        number: { type: string, nullable: true }
        title: { type: string, nullable: true }
        text: { type: string }
        lang: { type: string, nullable: true }
        parent_id: { type: string, nullable: true }
        stable_path: { type: string, description: 'VD: "annex-01/art-5/cl-2/pt-a"' }
        page_start: { type: integer }
        page_end: { type: integer }
        confidence: { type: number }
        regions:
          type: array
          items:
            type: object
            properties:
              page_no: { type: integer }
              bbox: { $ref: '#/components/schemas/BBox' }
              bbox_source: { $ref: '#/components/schemas/BBoxSource' }
        children:
          type: array
          items: { $ref: '#/components/schemas/ClauseNode' }

    # ── Tables ─────────────────────────────────────────────────────────────
    TableCell:
      type: object
      properties:
        row_idx: { type: integer }
        col_idx: { type: integer }
        row_span: { type: integer, default: 1 }
        col_span: { type: integer, default: 1 }
        text: { type: string }
        bbox: { $ref: '#/components/schemas/BBox' }
        is_header: { type: boolean }
        confidence: { type: number }

    DocTable:
      type: object
      properties:
        id: { type: string }
        document_id: { type: string }
        page_no: { type: integer }
        bbox: { $ref: '#/components/schemas/BBox' }
        rows_count: { type: integer }
        cols_count: { type: integer }
        has_borders: { type: boolean }
        is_multi_page: { type: boolean }
        continued_from: { type: string, nullable: true }
        cells:
          type: array
          items: { $ref: '#/components/schemas/TableCell' }

    # ── Citation ───────────────────────────────────────────────────────────
    CitationSegment:
      type: object
      required: [page_no, char_start, char_end, bbox]
      properties:
        page_no: { type: integer }
        line_id: { type: string }
        char_start: { type: integer }
        char_end: { type: integer }
        bbox: { $ref: '#/components/schemas/BBox' }
        bbox_level: { $ref: '#/components/schemas/BBoxLevel' }

    Citation:
      type: object
      properties:
        id: { type: string }
        document_id: { type: string }
        run_id: { type: string }
        quote: { type: string }
        quote_sha256: { type: string }
        segments:
          type: array
          items: { $ref: '#/components/schemas/CitationSegment' }
        doc_char_span:
          type: array
          items: { type: integer }
          minItems: 2
          maxItems: 2
        coord_system: { $ref: '#/components/schemas/CoordSystem' }

    CitationResolved:
      type: object
      description: Output của GET /citations/{id} — đủ thông tin để UI highlight một thao tác
      properties:
        citation: { $ref: '#/components/schemas/Citation' }
        page_images:
          type: array
          description: Một URL ảnh preview cho mỗi trang có segment
          items:
            type: object
            properties:
              page_no: { type: integer }
              preview_url: { type: string }

    # ── Fact ───────────────────────────────────────────────────────────────
    Fact:
      type: object
      properties:
        id: { type: string }
        document_id: { type: string }
        run_id: { type: string }
        key: { type: string, description: 'VD: "price.total", "party.name"' }
        fact_type: { type: string }
        raw_text: { type: string }
        normalized_value: {}
        context_clause_id: { type: string, nullable: true }
        context_text: { type: string, nullable: true }
        confidence: { type: number }
        extractor: { type: string }
        validation_status: { type: string, enum: [passed, failed, skipped] }
        citation: { $ref: '#/components/schemas/Citation' }
        trace_id: { type: string, nullable: true }

    FactEffective:
      type: object
      description: Fact kèm giá trị hiệu lực sau review + ETag cho optimistic concurrency
      properties:
        fact: { $ref: '#/components/schemas/Fact' }
        machine_value: {}
        effective_value: { nullable: true }
        review_state:
          type: string
          enum: [unreviewed, confirmed, corrected, rejected, awaiting_evidence]
        reviewer_id: { type: string, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        review_item_id:
          type: string
          nullable: true
          description: ID của review_item tương ứng (NULL = chưa sinh item)
        current_version:
          type: integer
          minimum: 0
          description: |
            Version hiện tại của review_item (0 = giá trị máy, 1..N = sau N lần action).
            **Client PHẢI gửi lại giá trị này trong `base_version` khi submit action.**

    # ── Finding ────────────────────────────────────────────────────────────
    FindingSide:
      type: object
      properties:
        side: { type: string, enum: [a, b] }
        document_id: { type: string }
        document_role: { type: string, enum: [contract, annex] }
        fact_id: { type: string, nullable: true }
        clause_node_id: { type: string, nullable: true }
        citation: { $ref: '#/components/schemas/Citation' }
        value_snapshot: { nullable: true }

    Finding:
      type: object
      properties:
        id: { type: string }
        dossier_id: { type: string }
        run_id: { type: string }
        finding_type: { $ref: '#/components/schemas/FindingType' }
        scope: { $ref: '#/components/schemas/FindingScope' }
        key_or_topic: { type: string }
        disposition: { $ref: '#/components/schemas/Disposition' }
        severity: { $ref: '#/components/schemas/Severity' }
        confidence: { type: number }
        rationale: { type: string }
        method: { type: string }
        sides:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/FindingSide' }
        disclaimer:
          type: string
          default: "Kết quả so sánh kỹ thuật, không phải kết luận pháp lý."
        review:
          type: object
          nullable: true
          properties:
            item_id: { type: string }
            status: { $ref: '#/components/schemas/ReviewItemStatus' }
            current_version: { type: integer }

    # ── Review item & action ───────────────────────────────────────────────
    ReviewItem:
      type: object
      properties:
        id: { type: string }
        dossier_id: { type: string }
        run_id: { type: string }
        target_type: { $ref: '#/components/schemas/TargetType' }
        target_id: { type: string }
        reason: { type: string }
        priority: { $ref: '#/components/schemas/ReviewItemPriority' }
        status: { $ref: '#/components/schemas/ReviewItemStatus' }
        version:
          type: integer
          minimum: 1
          description: Version hiện tại của item — client gửi lại trong `base_version` khi submit action
        source_trace_id: { type: string, nullable: true }
        source_observation_id: { type: string, nullable: true }
        target_snapshot:
          description: Snapshot target để reviewer thấy ngay không cần join
          oneOf:
            - $ref: '#/components/schemas/FactEffective'
            - $ref: '#/components/schemas/Finding'
            - $ref: '#/components/schemas/ClauseNode'
        created_at: { type: string, format: date-time }

    ReviewActionRequest:
      type: object
      required: [action, base_version]
      properties:
        action: { $ref: '#/components/schemas/ReviewActionType' }
        base_version:
          type: integer
          minimum: 0
          description: |
            Version hiện tại của review_item mà client đang thấy. **0** = dựa trên máy.
            **1, 2, ...** = sau N lần action.
            Mismatch với DB → 409 Conflict.
        corrected_value:
          description: Bắt buộc nếu action=correct và không có corrected_bbox
        corrected_bbox:
          type: array
          description: Bắt buộc nếu action=correct và không có corrected_value (cho citation)
          items:
            type: object
            properties:
              page_no: { type: integer }
              bbox: { $ref: '#/components/schemas/BBox' }
        comment: { type: string, maxLength: 2000 }

    ReviewActionResponse:
      type: object
      properties:
        review_action_id: { type: string }
        item_status: { $ref: '#/components/schemas/ReviewItemStatus' }
        new_version: { type: integer }
        effective_value: { nullable: true }
        machine_value: { nullable: true }
        job_status: { $ref: '#/components/schemas/JobStatus' }
        open_items_remaining: { type: integer }
        idempotent_replay:
          type: boolean
          description: True nếu response này từ Idempotency-Key replay (60s window)

    ReviewConflictResponse:
      type: object
      description: Trả về khi `base_version` không khớp DB
      properties:
        error:
          type: object
          properties:
            code: { type: string, enum: [VERSION_CONFLICT] }
            message: { type: string, example: "Version conflict: another action was submitted before yours (current version: 4)." }
        current_state:
          description: Trạng thái hiện tại của target để client refetch và reconcile
          oneOf:
            - $ref: '#/components/schemas/FactEffective'
            - $ref: '#/components/schemas/Finding'
        your_submitted_action:
          type: object
          nullable: true
          description: Nếu action của bạn vẫn được ghi nhận dù version mismatch (server policy), thông tin action ở đây

    ApproveRequest:
      type: object
      properties:
        comment: { type: string, maxLength: 2000 }

    # ── Job ────────────────────────────────────────────────────────────────
    JobStepProgress:
      type: object
      properties:
        step: { type: string, description: 'S0..S10' }
        status: { type: string, enum: [queued, running, succeeded, failed, retrying, skipped] }
        attempt: { type: integer }
        duration_ms: { type: integer, nullable: true }
        pages: { type: integer, nullable: true }
        error_code: { type: string, nullable: true }

    Job:
      type: object
      properties:
        id: { type: string }
        dossier_id: { type: string }
        batch_id: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/JobStatus' }
        current_run_id: { type: string, nullable: true }
        has_conflicts: { type: boolean }
        error_code: { type: string, nullable: true }
        error_detail: { nullable: true }
        trace_url: { type: string, nullable: true, description: Link "Mở trace" trên Langfuse }
        progress:
          type: object
          properties:
            total_steps: { type: integer }
            done_steps: { type: integer }
            current_step: { type: string, nullable: true }
            current_step_detail: { type: string, nullable: true, description: 'VD: "OCR trang 5/12 — Hợp đồng"' }
            open_review_items: { type: integer, nullable: true }
        steps:
          type: array
          items: { $ref: '#/components/schemas/JobStepProgress' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── Batch ──────────────────────────────────────────────────────────────
    BatchCreated:
      type: object
      properties:
        batch_id: { type: string }
        dossier_count: { type: integer }
        dossier_ids:
          type: array
          items: { type: string }
        job_ids:
          type: array
          items: { type: string }

    BatchSummary:
      type: object
      properties:
        batch_id: { type: string }
        name: { type: string }
        auto_paused: { type: boolean }
        auto_pause_reason: { type: string, nullable: true }
        total: { type: integer }
        done: { type: integer, description: "reviewed + approved" }
        needs_review: { type: integer }
        failed: { type: integer }
        in_progress: { type: integer }
        total_pages: { type: integer }
        total_cost_usd: { type: number }
        wall_clock_seconds: { type: number }
        dossiers_per_hour: { type: number }
        error_code_distribution:
          type: object
          additionalProperties:
            type: integer
          description: 'VD: {"OCR_RATE_LIMITED": 3, "DB_ERROR": 1}'

    # ── Audit ──────────────────────────────────────────────────────────────
    AuditEvent:
      type: object
      properties:
        id: { type: string, description: 'job_event.id | review_action.id | approval.id' }
        event_type:
          type: string
          enum: [job_status_changed, review_action_recorded, dossier_approved]
        job_id: { type: string, nullable: true }
        from_status: { type: string, nullable: true }
        to_status: { type: string, nullable: true }
        actor: { type: string, description: '"system" hoặc user_id' }
        target_type: { $ref: '#/components/schemas/TargetType' }
        target_id: { type: string, nullable: true }
        version: { type: integer, nullable: true }
        comment: { type: string, nullable: true }
        trace_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    # ── Export ─────────────────────────────────────────────────────────────
    ExportPayload:
      type: object
      properties:
        dossier: { $ref: '#/components/schemas/Dossier' }
        run_id: { type: string }
        facts:
          type: array
          items: { $ref: '#/components/schemas/FactEffective' }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        review_items:
          type: array
          items: { $ref: '#/components/schemas/ReviewItem' }
        snapshot_sha256: { type: string }
        generated_at: { type: string, format: date-time }

    # ── Ops ────────────────────────────────────────────────────────────────
    OpsSummary:
      type: object
      properties:
        window: { type: object, properties: { from: { type: string, format: date-time }, to: { type: string, format: date-time } } }
        jobs_by_status:
          type: object
          additionalProperties: { type: integer }
        throughput:
          type: object
          properties:
            dossiers_per_hour: { type: number }
            pages_per_minute: { type: number }
            median_dossier_minutes: { type: number }
            p95_dossier_minutes: { type: number }
        cost:
          type: object
          properties:
            mean_usd_per_dossier: { type: number }
            p95_usd_per_dossier: { type: number }
            projected_usd_per_1000: { type: number }
            by_model:
              type: object
              additionalProperties: { type: number }
        failures:
          type: object
          properties:
            by_error_code:
              type: object
              additionalProperties: { type: integer }
            batch_paused_count: { type: integer }
            worker_lost_count: { type: integer }

    # ── Envelopes (data wrapper) ────────────────────────────────────────────
    ApiEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          nullable: true
        meta:
          type: object
          properties:
            request_id: { type: string }
            trace_id: { type: string }
            timestamp: { type: string, format: date-time }

    Pagination:
      type: object
      properties:
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }
        total:
          type: integer
          nullable: true
          description: Có thể null nếu không đếm được (cursor-based)

    ApiEnvelopeDossierCreated:
      type: object
      properties:
        data:
          type: object
          properties:
            dossier_id: { type: string }
            job_id: { type: string }
        meta: { $ref: '#/components/schemas/ApiEnvelope/properties/meta' }

    ApiEnvelopeDossier:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Dossier' }

    ApiEnvelopeDossierList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/DossierSummary' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    ApiEnvelopeJob:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Job' }

    ApiEnvelopeBatchCreated:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/BatchCreated' }

    ApiEnvelopeBatchSummary:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/BatchSummary' }

    ApiEnvelopePageList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Page' }

    ApiEnvelopePageOcr:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/PageOcr' }

    ApiEnvelopeClauseTree:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/ClauseNode' }

    ApiEnvelopeTableList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/DocTable' }

    ApiEnvelopeFactList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/FactEffective' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    ApiEnvelopeFindingList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Finding' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    ApiEnvelopeCitationResolved:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/CitationResolved' }

    ApiEnvelopeReviewItem:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ReviewItem' }

    ApiEnvelopeReviewItemList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/ReviewItem' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    ApiEnvelopeReviewAction:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ReviewActionResponse' }

    ApiEnvelopeReviewConflict:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ReviewConflictResponse' }

    ApiEnvelopeAudit:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/AuditEvent' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    ApiEnvelopeExport:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ExportPayload' }

    ApiEnvelopeOpsSummary:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/OpsSummary' }

  # ── Responses ───────────────────────────────────────────────────────────
  responses:
    BadRequest:
      description: Request không hợp lệ (validation, schema)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource không tồn tại
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: File vượt quá giới hạn (mặc định 50 MB)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Bị rate limit (429)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

# ═══════════════════════════════════════════════════════════════════════════
# SECURITY, WEBHOOKS, CALLBACKS
# ═══════════════════════════════════════════════════════════════════════════
security:
  - cookieAuth: []

webhooks:
  jobStatusChanged:
    post:
      summary: (Tuỳ chọn) Webhook khi job chuyển trạng thái
      description: |
        Internal webhook cho integration test hoặc external system.
        Mặc định client dùng polling `/jobs/{id}` 2-3s/lần (xem DOC-04 8.0).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                job_id: { type: string }
                dossier_id: { type: string }
                from_status: { $ref: '#/components/schemas/JobStatus' }
                to_status: { $ref: '#/components/schemas/JobStatus' }
                trace_id: { type: string }
      responses:
        '200':
          description: Accepted

securitySchemes:
  cookieAuth:
    type: apiKey
    in: cookie
    name: ci_session
    description: Session cookie HttpOnly, SameSite=Lax (mục 14.4 DOC-04)
