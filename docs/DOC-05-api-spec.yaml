  # ─── Review ──────────────────────────────────────────────────────────────
  /dossiers/{dossier_id}/review-items:
    parameters:
      - $ref: '#/components/parameters/DossierId'
      - name: status
        in: query
        schema:
          type: string
          enum: [open, awaiting_evidence, resolved]
      - name: priority
        in: query
        schema: { type: string, enum: [P1, P2, P3] }
    get:
      tags: [review]
      summary: Hàng đợi review
      operationId: listReviewItems
      x-rbac: [REVIEWER, ADMINISTRATOR]
      responses:
        '200':
          description: Review item list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeReviewItemList'

  /review-items/{review_item_id}:
    parameters:
      - name: review_item_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [review]
      summary: Chi tiết review item (kèm version & target snapshot)
      operationId: getReviewItem
      x-rbac: [REVIEWER, ADMINISTRATOR]
      responses:
        '200':
          description: Review item detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeReviewItem'
        '404':
          $ref: '#/components/responses/NotFound'

  /review-items/{review_item_id}/actions:
    parameters:
      - name: review_item_id
        in: path
        required: true
        schema: { type: string }
      - name: Idempotency-Key
        in: header
        required: false
        schema: { type: string, format: uuid }
    post:
      tags: [review]
      summary: Submit review action (Confirm / Correct / Reject / Needs more evidence)
      description: |
        **Optimistic concurrency bắt buộc:**
        - Client gửi `base_version` (là `current_version` đã đọc trước đó, hoặc `0` nếu dựa trên máy).
        - Nếu DB hiện đang ở version khác → API trả **`409 Conflict`** kèm state mới nhất để client refetch.
        - Trong vòng 60s sau lần submit đầu, request lặp lại với cùng `Idempotency-Key` sẽ trả cùng kết quả (retry an toàn).
        - Với `correct`, `corrected_value` hoặc `corrected_bbox` phải có (CHECK constraint).
      operationId: submitReviewAction
      x-rbac: [REVIEWER, ADMINISTRATOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewActionRequest'
      responses:
        '200':
          description: Action recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeReviewAction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Revision conflict — concurrent update detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeReviewConflict'

  /review-items/{review_item_id}/revisions:
    parameters:
      - name: review_item_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [revisions]
      summary: Lấy chuỗi lịch sử phiên bản thẩm tra bất biến (append-only review revisions)
      description: |
        Tuân thủ quy chuẩn kiểm toán Enterprise: Mọi thao tác review (confirm, correct, reject)
        đều tạo một revision bất biến mới (append-only) chứ không ghi đè, kèm diff, author và version.
      operationId: listReviewItemRevisions
      x-rbac: [REVIEWER, ADMINISTRATOR]
      responses:
        '200':
          description: Append-only review revisions trail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeReviewRevisions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

