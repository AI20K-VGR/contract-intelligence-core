      summary: Tạo yêu cầu OCR lại tài liệu hoặc dải trang với profile chuyên sâu
      description: |
        Áp dụng khi chất lượng OCR mặc định thấp, trang bị mờ, chữ viết tay hoặc chứa bảng phức tạp.
        Profiles hỗ trợ: `high_res_binarize`, `table_optimized`, `handwritten_vietnamese`.
      operationId: requestDocumentReOcr
      x-rbac: [OPERATOR, REVIEWER, ADMINISTRATOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReOcrRequestPayload'
      responses:
        '202':
          description: Re-OCR request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeReOcrRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/{document_id}/re-ocr-requests:
