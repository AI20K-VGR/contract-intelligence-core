          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [optimization]
      summary: Thiết lập thực nghiệm so sánh candidate trên tập Golden Dataset
      operationId: createOptimizationExperiment
      x-rbac: [ADMINISTRATOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExperimentRequest'
      responses:
        '201':
          description: Experiment configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeExperiment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /optimization/experiments/{experiment_id}/run:
    parameters:
      - $ref: '#/components/parameters/ExperimentId'
    post:
      tags: [optimization]
      summary: Kích hoạt chạy thực nghiệm đánh giá benchmark
      operationId: runOptimizationExperiment
      x-rbac: [ADMINISTRATOR]
      responses:
        '202':
          description: Experiment execution started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeExperiment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Experiment is already running or finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /optimization/experiments/{experiment_id}/results:
    parameters:
      - $ref: '#/components/parameters/ExperimentId'
    get:
      tags: [optimization]
      summary: Kết quả chi tiết của thực nghiệm (F1-score, Precision, Recall, Latency, Token Cost)
      operationId: getOptimizationExperimentResults
      x-rbac: [ADMINISTRATOR]
      responses:
        '200':
          description: Detailed benchmark results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeExperimentResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Audit & Export ──────────────────────────────────────────────────────
  /dossiers/{dossier_id}/audit:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    get:
      tags: [audit]
      summary: Dòng thời gian job_event + review_action + approval
      operationId: getAuditTrail
      x-rbac: [OPERATOR, REVIEWER, ADMINISTRATOR]
      responses:
        '200':
          description: Audit trail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeAudit'

  /dossiers/{dossier_id}/export:
    parameters:
      - $ref: '#/components/parameters/DossierId'
      - name: run_id
        in: query
        schema: { type: string }
    get:
      tags: [dossiers]
      summary: Export JSON kết quả máy + giá trị hiệu lực
      operationId: exportDossier
      x-rbac: [OPERATOR, REVIEWER, ADMINISTRATOR]
      responses:
        '200':
          description: Export JSON (gzip được)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeExport'

  # ─── Ops ─────────────────────────────────────────────────────────────────
  /ops/summary:
    parameters:
      - name: from
        in: query
        schema: { type: string, format: date-time }
      - name: to
        in: query
        schema: { type: string, format: date-time }
    get:
      tags: [ops]
      summary: KPI throughput, cost, failure (NFR-02/03)
      operationId: getOpsSummary
      x-rbac: [ADMINISTRATOR]
      responses:
        '200':
          description: Ops summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeOpsSummary'

  # ─── Health ──────────────────────────────────────────────────────────────
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: healthz
      x-rbac: [OPERATOR, REVIEWER, ADMINISTRATOR]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe (DB + data dir)
      operationId: readyz
      x-rbac: [OPERATOR, REVIEWER, ADMINISTRATOR]
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Not ready (DB down, disk full, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'

# ═══════════════════════════════════════════════════════════════════════════
# COMPONENTS
# ═══════════════════════════════════════════════════════════════════════════
components:

  # ── Headers ──────────────────────────────────────────────────────────────
  headers:
    TraceId:
      description: ID trace OpenTelemetry (hex 32 ký tự)
      schema: { type: string, pattern: "^[0-9a-f]{32}$" }

  # ── Parameters ───────────────────────────────────────────────────────────
  parameters:
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema: { type: string, pattern: "^tnt_[0-9A-HJKMNP-TV-Z]{26}$" }
      description: Định danh tenant phục vụ phân lập dữ liệu (Tenant Isolation)
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, pattern: "^run_[0-9A-HJKMNP-TV-Z]{26}$" }
    CampaignId:
      name: campaign_id
      in: path
      required: true
      schema: { type: string, pattern: "^cmp_[0-9A-HJKMNP-TV-Z]{26}$" }
    CandidateId:
      name: candidate_id
      in: path
      required: true
      schema: { type: string, pattern: "^cnd_[0-9A-HJKMNP-TV-Z]{26}$" }
    ExperimentId:
      name: experiment_id
      in: path
      required: true
      schema: { type: string, pattern: "^exp_[0-9A-HJKMNP-TV-Z]{26}$" }
    DossierId:
      name: dossier_id
      in: path
      required: true
      schema: { type: string, pattern: "^dos_[0-9A-HJKMNP-TV-Z]{26}$" }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, pattern: "^job_[0-9A-HJKMNP-TV-Z]{26}$" }
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: { type: string, pattern: "^doc_[0-9A-HJKMNP-TV-Z]{26}$" }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  # ── Schemas ──────────────────────────────────────────────────────────────
  schemas:

    # ── Problem Details (RFC 9457) ──────────────────────────────────────────
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: |
            Mã lỗi nội bộ (xem DOC-04 mục 8.6).
            Ví dụ: `PDF_INVALID`, `OCR_RATE_LIMITED`, `DB_ERROR`, `INTERNAL_ERROR`.
        detail: { type: string }
        instance: { type: string }
        trace_id:
          type: string
          description: ID trace OpenTelemetry để debug

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              ok: { type: boolean }
              detail: { type: string }

    # ── Shared enums ───────────────────────────────────────────────────────
    JobStatus:
      type: string
      enum: [uploaded, processing, extracted, pending_review, reviewed, approved, failed]
      description: Trạng thái job (BRD §14)

    PageKind:
      type: string
      enum: [native, scanned, hybrid]

    Disposition:
      type: string
      enum:
        - comparable_match
        - comparable_difference
        - candidate_amendment
        - not_comparable
        - insufficient_evidence

    Severity:
      type: string
      enum: [high, medium, low]

    FindingType:
      type: string
      enum: [structured, semantic]

    FindingScope:
      type: string
      enum: [within_document, contract_annex, annex_annex]

    ReviewActionType:
      type: string
      enum: [confirm, correct, reject, needs_more_evidence]

    ReviewItemStatus:
      type: string
      enum: [open, awaiting_evidence, resolved]

    ReviewItemPriority:
      type: string
      enum: [P1, P2, P3]

    TargetType:
      type: string
      enum: [fact, finding, annex_link, clause_node, table_cell, citation]

    # ── Geometry ───────────────────────────────────────────────────────────
    BBox:
      type: object
      description: Canonical Page Space (CPS) — `[x0,y0,x1,y1]` chuẩn hóa 0..1
      required: [x0, y0, x1, y1]
      properties:
        x0: { type: number, minimum: 0, maximum: 1 }
        y0: { type: number, minimum: 0, maximum: 1 }
        x1: { type: number, minimum: 0, maximum: 1 }
        y1: { type: number, minimum: 0, maximum: 1 }

    BBoxLevel:
      type: string
      enum: [word_union, line, clause_region]

    BBoxSource:
      type: string
      enum: [native, detector, estimated, human]

    CoordSystem:
      type: object
      required: [space, range, origin, format]
      properties:
        space: { type: string, enum: [CPS] }
        range: { type: string, enum: ["0..1"] }
        origin: { type: string, enum: ["top-left"] }
        format: { type: string, enum: ["x0,y0,x1,y1"] }

    # ── Dossier ────────────────────────────────────────────────────────────
    Dossier:
      type: object
      required: [id, name, has_conflicts, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        batch_id: { type: string, nullable: true }
        has_conflicts: { type: boolean }
        latest_job_id: { type: string, nullable: true }
        latest_job_status: { $ref: '#/components/schemas/JobStatus' }
        documents:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        open_review_items: { type: integer, description: Tổng review_item chưa resolved }
        pending_conflicts: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DossierSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        batch_id: { type: string, nullable: true }
        has_conflicts: { type: boolean }
        latest_job_status: { $ref: '#/components/schemas/JobStatus' }
        open_review_items: { type: integer }
        pending_conflicts: { type: integer }
        created_at: { type: string, format: date-time }

    DossierUploadRequest:
      type: object
      required: [contract, metadata]
      properties:
        contract:
          type: string
          format: binary
          description: File PDF hợp đồng chính
        annexes:
          type: array
          items: { type: string, format: binary }
          description: Các file PDF phụ lục theo thứ tự
        metadata:
          type: object
          description: |
            JSON object. Khuyến nghị: `{"name": "...", "tags": [...], "notes": "..."}`.
            Tên nếu thiếu sẽ lấy từ file hợp đồng.

    # ── Document & Pages ───────────────────────────────────────────────────
    Document:
      type: object
      properties:
        id: { type: string }
        dossier_id: { type: string }
        role: { type: string, enum: [contract, annex] }
        order_index: { type: integer }
        filename: { type: string }
        sha256: { type: string }
        page_count: { type: integer }
        lang_detected: { type: string, nullable: true }
        annex_link_status:
          $ref: '#/components/schemas/AnnexLinkStatus'
          nullable: true

    AnnexLinkStatus:
      type: string
      enum: [linked, linked_needs_review, unlinked]

    Page:
      type: object
      properties:
        id: { type: string }
        document_id: { type: string }
        page_no: { type: integer }
        kind: { $ref: '#/components/schemas/PageKind' }
        width_pt: { type: number }
        height_pt: { type: number }
        rotation: { type: integer, enum: [0, 90, 180, 270] }
        render_dpi: { type: integer }
        preview_uri: { type: string, nullable: true }
        render_uri: { type: string, nullable: true }
        quality:
          type: object
          additionalProperties: true
          description: 'Chỉ số chất lượng: blur_score, skew_deg, contrast, ...'

    PageOcrLine:
      type: object
      properties:
        line_id: { type: string }
        line_no: { type: integer }
        text: { type: string }
        bbox: { $ref: '#/components/schemas/BBox' }
        bbox_source: { $ref: '#/components/schemas/BBoxSource' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        flags:
          type: object
          properties:
            numeric_mismatch: { type: boolean }
            unaligned: { type: boolean }
            region: { type: string, enum: [body, header, footer, table] }
        char_span_doc: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }

    PageOcr:
      type: object
      properties:
        page_id: { type: string }
        run_id: { type: string }
        kind: { $ref: '#/components/schemas/PageKind' }
        cps:
          type: object
          properties:
            width_pt: { type: number }
            height_pt: { type: number }
            rotation: { type: integer }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PageOcrLine' }

    # ── Clauses ────────────────────────────────────────────────────────────
    ClauseNode:
      type: object
      properties:
        id: { type: string }
        document_id: { type: string }
        node_type: { type: string, enum: [annex, article, clause, point, preamble, signature_block] }
        label: { type: string, description: 'VD: "Điều 5"' }
        number: { type: string, nullable: true }
        title: { type: string, nullable: true }
        text: { type: string }
        lang: { type: string, nullable: true }
        parent_id: { type: string, nullable: true }
        stable_path: { type: string, description: 'VD: "annex-01/art-5/cl-2/pt-a"' }
        page_start: { type: integer }
        page_end: { type: integer }
        confidence: { type: number }
        regions:
          type: array
          items:
            type: object
            properties:
              page_no: { type: integer }
              bbox: { $ref: '#/components/schemas/BBox' }
              bbox_source: { $ref: '#/components/schemas/BBoxSource' }
        children:
          type: array
          items: { $ref: '#/components/schemas/ClauseNode' }

    # ── Tables ─────────────────────────────────────────────────────────────
    TableCell:
      type: object
      properties:
        row_idx: { type: integer }
        col_idx: { type: integer }
        row_span: { type: integer, default: 1 }
        col_span: { type: integer, default: 1 }
        text: { type: string }
        bbox: { $ref: '#/components/schemas/BBox' }
        is_header: { type: boolean }
        confidence: { type: number }

    DocTable:
      type: object
      properties:
        id: { type: string }
        document_id: { type: string }
        page_no: { type: integer }
        bbox: { $ref: '#/components/schemas/BBox' }
        rows_count: { type: integer }
        cols_count: { type: integer }
        has_borders: { type: boolean }
        is_multi_page: { type: boolean }
        continued_from: { type: string, nullable: true }
        cells:
          type: array
          items: { $ref: '#/components/schemas/TableCell' }

    # ── Citation ───────────────────────────────────────────────────────────
    CitationSegment:
      type: object
      required: [page_no, char_start, char_end, bbox]
      properties:
        page_no: { type: integer }
        line_id: { type: string }
        char_start: { type: integer }
        char_end: { type: integer }
        bbox: { $ref: '#/components/schemas/BBox' }
        bbox_level: { $ref: '#/components/schemas/BBoxLevel' }

    Citation:
      type: object
      properties:
        id: { type: string }
        document_id: { type: string }
        run_id: { type: string }
        quote: { type: string }
        quote_sha256: { type: string }
        segments:
          type: array
          items: { $ref: '#/components/schemas/CitationSegment' }
        doc_char_span:
          type: array
          items: { type: integer }
          minItems: 2
          maxItems: 2
        coord_system: { $ref: '#/components/schemas/CoordSystem' }

    CitationResolved:
      type: object
      description: Output của GET /citations/{id} — đủ thông tin để UI highlight một thao tác
      properties:
        citation: { $ref: '#/components/schemas/Citation' }
        page_images:
          type: array
          description: Một URL ảnh preview cho mỗi trang có segment
          items:
            type: object
            properties:
              page_no: { type: integer }
              preview_url: { type: string }

    # ── Fact ───────────────────────────────────────────────────────────────
    Fact:
      type: object
      properties:
        id: { type: string }
        document_id: { type: string }
        run_id: { type: string }
        key: { type: string, description: 'VD: "price.total", "party.name"' }
        fact_type: { type: string }
        raw_text: { type: string }
        normalized_value: {}
        context_clause_id: { type: string, nullable: true }
        context_text: { type: string, nullable: true }
        confidence: { type: number }
        extractor: { type: string }
        validation_status: { type: string, enum: [passed, failed, skipped] }
        citation: { $ref: '#/components/schemas/Citation' }
        trace_id: { type: string, nullable: true }

    FactEffective:
      type: object
      description: Fact kèm giá trị hiệu lực sau review + ETag cho optimistic concurrency
      properties:
        fact: { $ref: '#/components/schemas/Fact' }
        machine_value: {}
        effective_value: { nullable: true }
        review_state:
          type: string
          enum: [unreviewed, confirmed, corrected, rejected, awaiting_evidence]
        reviewer_id: { type: string, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        review_item_id:
          type: string
          nullable: true
          description: ID của review_item tương ứng (NULL = chưa sinh item)
        current_version:
          type: integer
          minimum: 0
          description: |
            Version hiện tại của review_item (0 = giá trị máy, 1..N = sau N lần action).
            **Client PHẢI gửi lại giá trị này trong `base_version` khi submit action.**

    # ── Finding ────────────────────────────────────────────────────────────
    FindingSide:
      type: object
      properties:
        side: { type: string, enum: [a, b] }
        document_id: { type: string }
        document_role: { type: string, enum: [contract, annex] }
        fact_id: { type: string, nullable: true }
        clause_node_id: { type: string, nullable: true }
        citation: { $ref: '#/components/schemas/Citation' }
        value_snapshot: { nullable: true }

    Finding:
      type: object
      properties:
        id: { type: string }
        dossier_id: { type: string }
        run_id: { type: string }
        finding_type: { $ref: '#/components/schemas/FindingType' }
        scope: { $ref: '#/components/schemas/FindingScope' }
        key_or_topic: { type: string }
        disposition: { $ref: '#/components/schemas/Disposition' }
        severity: { $ref: '#/components/schemas/Severity' }
        confidence: { type: number }
        rationale: { type: string }
        method: { type: string }
        sides:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/FindingSide' }
        disclaimer:
          type: string
          default: "Kết quả so sánh kỹ thuật, không phải kết luận pháp lý."
        review:
          type: object
          nullable: true
          properties:
            item_id: { type: string }
            status: { $ref: '#/components/schemas/ReviewItemStatus' }
            current_version: { type: integer }

    # ── Review item & action ───────────────────────────────────────────────
    ReviewItem:
      type: object
      properties:
        id: { type: string }
        dossier_id: { type: string }
        run_id: { type: string }
        target_type: { $ref: '#/components/schemas/TargetType' }
        target_id: { type: string }
        reason: { type: string }
        priority: { $ref: '#/components/schemas/ReviewItemPriority' }
        status: { $ref: '#/components/schemas/ReviewItemStatus' }
        version:
          type: integer
          minimum: 1
          description: Version hiện tại của item — client gửi lại trong `base_version` khi submit action
        source_trace_id: { type: string, nullable: true }
        source_observation_id: { type: string, nullable: true }
        target_snapshot:
          description: Snapshot target để reviewer thấy ngay không cần join
          oneOf:
            - $ref: '#/components/schemas/FactEffective'
            - $ref: '#/components/schemas/Finding'
            - $ref: '#/components/schemas/ClauseNode'
        created_at: { type: string, format: date-time }

    ReviewActionRequest:
      type: object
      required: [action, base_version]
      properties:
        action: { $ref: '#/components/schemas/ReviewActionType' }
        base_version:
          type: integer
          minimum: 0
          description: |
            Version hiện tại của review_item mà client đang thấy. **0** = dựa trên máy.
            **1, 2, ...** = sau N lần action.
            Mismatch với DB → 409 Conflict.
        corrected_value:
          description: Bắt buộc nếu action=correct và không có corrected_bbox
        corrected_bbox:
          type: array
          description: Bắt buộc nếu action=correct và không có corrected_value (cho citation)
          items:
            type: object
            properties:
              page_no: { type: integer }
              bbox: { $ref: '#/components/schemas/BBox' }
        comment: { type: string, maxLength: 2000 }

    ReviewActionResponse:
      type: object
      properties:
        review_action_id: { type: string }
        item_status: { $ref: '#/components/schemas/ReviewItemStatus' }
        new_version: { type: integer }
        effective_value: { nullable: true }
        machine_value: { nullable: true }
        job_status: { $ref: '#/components/schemas/JobStatus' }
        open_items_remaining: { type: integer }
        idempotent_replay:
          type: boolean
          description: True nếu response này từ Idempotency-Key replay (60s window)

    ReviewConflictResponse:
      type: object
      description: Trả về khi `base_version` không khớp DB
      properties:
        error:
          type: object
          properties:
            code: { type: string, enum: [VERSION_CONFLICT] }
            message: { type: string, example: "Version conflict: another action was submitted before yours (current version: 4)." }
        current_state:
          description: Trạng thái hiện tại của target để client refetch và reconcile
          oneOf:
            - $ref: '#/components/schemas/FactEffective'
            - $ref: '#/components/schemas/Finding'
        your_submitted_action:
          type: object
          nullable: true
          description: Nếu action của bạn vẫn được ghi nhận dù version mismatch (server policy), thông tin action ở đây

    ApproveRequest:
      type: object
      properties:
        comment: { type: string, maxLength: 2000 }

    # ── Job ────────────────────────────────────────────────────────────────
    JobStepProgress:
      type: object
      properties:
        step: { type: string, description: 'S0..S10' }
        status: { type: string, enum: [queued, running, succeeded, failed, retrying, skipped] }
        attempt: { type: integer }
        duration_ms: { type: integer, nullable: true }
        pages: { type: integer, nullable: true }
        error_code: { type: string, nullable: true }

    Job:
      type: object
      properties:
        id: { type: string }
        dossier_id: { type: string }
        batch_id: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/JobStatus' }
        current_run_id: { type: string, nullable: true }
        has_conflicts: { type: boolean }
        error_code: { type: string, nullable: true }
        error_detail: { nullable: true }
        trace_url: { type: string, nullable: true, description: Link "Mở trace" trên Langfuse }
        progress:
          type: object
          properties:
            total_steps: { type: integer }
            done_steps: { type: integer }
            current_step: { type: string, nullable: true }
            current_step_detail: { type: string, nullable: true, description: 'VD: "OCR trang 5/12 — Hợp đồng"' }
            open_review_items: { type: integer, nullable: true }
        steps:
          type: array
          items: { $ref: '#/components/schemas/JobStepProgress' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── Batch ──────────────────────────────────────────────────────────────
    BatchCreated:
      type: object
      properties:
        batch_id: { type: string }
        dossier_count: { type: integer }
        dossier_ids:
          type: array
          items: { type: string }
        job_ids:
          type: array
          items: { type: string }

    BatchSummary:
      type: object
      properties:
        batch_id: { type: string }
        name: { type: string }
        auto_paused: { type: boolean }
        auto_pause_reason: { type: string, nullable: true }
        total: { type: integer }
        done: { type: integer, description: "reviewed + approved" }
        needs_review: { type: integer }
        failed: { type: integer }
        in_progress: { type: integer }
        total_pages: { type: integer }
        total_cost_usd: { type: number }
        wall_clock_seconds: { type: number }
        dossiers_per_hour: { type: number }
        error_code_distribution:
          type: object
          additionalProperties:
            type: integer
          description: 'VD: {"OCR_RATE_LIMITED": 3, "DB_ERROR": 1}'

    # ── Audit ──────────────────────────────────────────────────────────────
    AuditEvent:
      type: object
      properties:
        id: { type: string, description: 'job_event.id | review_action.id | approval.id' }
        event_type:
          type: string
          enum: [job_status_changed, review_action_recorded, dossier_approved]
        job_id: { type: string, nullable: true }
        from_status: { type: string, nullable: true }
        to_status: { type: string, nullable: true }
        actor: { type: string, description: '"system" hoặc user_id' }
        target_type: { $ref: '#/components/schemas/TargetType' }
        target_id: { type: string, nullable: true }
        version: { type: integer, nullable: true }
        comment: { type: string, nullable: true }
        trace_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    # ── Export ─────────────────────────────────────────────────────────────
    ExportPayload:
      type: object
      properties:
        dossier: { $ref: '#/components/schemas/Dossier' }
        run_id: { type: string }
        facts:
          type: array
          items: { $ref: '#/components/schemas/FactEffective' }
        findings:
          type: array
          items: { $ref: '#/components/schemas/Finding' }
        review_items:
          type: array
          items: { $ref: '#/components/schemas/ReviewItem' }
        snapshot_sha256: { type: string }
        generated_at: { type: string, format: date-time }

    # ── Ops ────────────────────────────────────────────────────────────────
    OpsSummary:
      type: object
      properties:
        window: { type: object, properties: { from: { type: string, format: date-time }, to: { type: string, format: date-time } } }
        jobs_by_status:
          type: object
          additionalProperties: { type: integer }
        throughput:
          type: object
          properties:
            dossiers_per_hour: { type: number }
            pages_per_minute: { type: number }
            median_dossier_minutes: { type: number }
            p95_dossier_minutes: { type: number }
        cost:
          type: object
          properties:
            mean_usd_per_dossier: { type: number }
            p95_usd_per_dossier: { type: number }
            projected_usd_per_1000: { type: number }
            by_model:
              type: object
              additionalProperties: { type: number }
        failures:
          type: object
          properties:
            by_error_code:
              type: object
              additionalProperties: { type: integer }
            batch_paused_count: { type: integer }
            worker_lost_count: { type: integer }

    # ── Envelopes (data wrapper) ────────────────────────────────────────────
    ApiEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          nullable: true
        meta:
          type: object
          properties:
            request_id: { type: string }
            trace_id: { type: string }
            timestamp: { type: string, format: date-time }

    Pagination:
      type: object
      properties:
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }
        total:
          type: integer
          nullable: true
          description: Có thể null nếu không đếm được (cursor-based)

    ApiEnvelopeDossierCreated:
      type: object
      properties:
        data:
          type: object
          properties:
            dossier_id: { type: string }
            job_id: { type: string }
        meta: { $ref: '#/components/schemas/ApiEnvelope/properties/meta' }

    ApiEnvelopeDossier:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Dossier' }

    ApiEnvelopeDossierList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/DossierSummary' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    ApiEnvelopeJob:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Job' }

    ApiEnvelopeBatchCreated:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/BatchCreated' }

    ApiEnvelopeBatchSummary:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/BatchSummary' }

    ApiEnvelopePageList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Page' }

    ApiEnvelopePageOcr:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/PageOcr' }

    ApiEnvelopeClauseTree:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/ClauseNode' }

    ApiEnvelopeTableList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/DocTable' }

    ApiEnvelopeFactList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/FactEffective' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    ApiEnvelopeFindingList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Finding' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    ApiEnvelopeCitationResolved:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/CitationResolved' }

    ApiEnvelopeReviewItem:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ReviewItem' }

    ApiEnvelopeReviewItemList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/ReviewItem' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    ApiEnvelopeReviewAction:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ReviewActionResponse' }

    ApiEnvelopeReviewConflict:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ReviewConflictResponse' }

    ApiEnvelopeAudit:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/AuditEvent' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    ApiEnvelopeExport:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ExportPayload' }

    ApiEnvelopeOpsSummary:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/OpsSummary' }

    # ── Dossier & Document Schemas ──────────────────────────────────────────
    DossierUpdateRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        metadata:
          type: object
          additionalProperties: true

    DocumentListItem:
      type: object
      required: [id, dossier_id, role, filename, file_size_bytes, page_count]
      properties:
        id: { type: string }
        dossier_id: { type: string }
        role: { type: string, enum: [CONTRACT, ANNEX] }
        filename: { type: string }
        file_size_bytes: { type: integer }
        page_count: { type: integer }
        signing_date: { type: string, format: date, nullable: true }
        document_number: { type: string, nullable: true }
        sha256: { type: string }

    DocumentDetail:
      allOf:
        - $ref: '#/components/schemas/DocumentListItem'
        - type: object
          properties:
            storage_path: { type: string }
            ocr_status: { type: string, enum: [pending, completed, failed] }
            created_at: { type: string, format: date-time }

    # ── Manifest Schemas ────────────────────────────────────────────────────
    ManifestDocumentItem:
      type: object
      required: [document_id, role, display_order]
      properties:
        document_id: { type: string }
        role: { type: string, enum: [CONTRACT, ANNEX] }
        display_order: { type: integer }
        title: { type: string }
        document_number: { type: string, nullable: true }
        signing_date: { type: string, format: date, nullable: true }
        annex_type: { type: string, nullable: true }
        parent_document_id: { type: string, nullable: true }

    DossierManifest:
      type: object
      required: [dossier_id, status, documents]
      properties:
        dossier_id: { type: string }
        status: { type: string, enum: [draft, confirmed, locked] }
        confirmed_by: { type: string, nullable: true }
        confirmed_at: { type: string, format: date-time, nullable: true }
        documents:
          type: array
          items: { $ref: '#/components/schemas/ManifestDocumentItem' }

    ConfirmManifestRequest:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ManifestDocumentItem' }
        notes: { type: string, nullable: true }

    # ── Pipeline Run Schemas ────────────────────────────────────────────────
    CreateRunRequest:
      type: object
      properties:
        config_override:
          type: object
          properties:
            ocr_profile: { type: string, enum: [standard, high_res_binarize, table_optimized] }
            prompt_candidate_id: { type: string }
            confidence_threshold: { type: number, minimum: 0, maximum: 1 }

    PipelineRunSummary:
      type: object
      required: [run_id, dossier_id, status, created_at]
      properties:
        run_id: { type: string }
        dossier_id: { type: string }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        triggered_by: { type: string }
        duration_seconds: { type: number, nullable: true }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    PipelineRunDetail:
      allOf:
        - $ref: '#/components/schemas/PipelineRunSummary'
        - type: object
          properties:
            stages:
              type: array
              items:
                type: object
                required: [stage_name, status]
                properties:
                  stage_name: { type: string }
                  status: { type: string, enum: [pending, running, completed, failed, skipped] }
                  duration_seconds: { type: number, nullable: true }
                  error_message: { type: string, nullable: true }
            metrics:
              type: object
              properties:
                pages_processed: { type: integer }
                facts_extracted: { type: integer }
                conflicts_found: { type: integer }
                tokens_consumed: { type: integer }
                cost_estimate_usd: { type: number }

    # ── Batch Schemas ───────────────────────────────────────────────────────
    BatchListItem:
      type: object
      required: [batch_id, status, total_dossiers, created_at]
      properties:
        batch_id: { type: string }
        status: { type: string, enum: [processing, completed, partial_failed, failed, cancelled] }
        total_dossiers: { type: integer }
        completed_dossiers: { type: integer }
        failed_dossiers: { type: integer }
        created_at: { type: string, format: date-time }

    BatchDetail:
      allOf:
        - $ref: '#/components/schemas/BatchListItem'
        - type: object
          properties:
            dossiers:
              type: array
              items:
                type: object
                required: [dossier_id, status]
                properties:
                  dossier_id: { type: string }
                  status: { type: string }
                  job_id: { type: string, nullable: true }

    # ── Re-OCR Schemas ──────────────────────────────────────────────────────
    ReOcrRequestPayload:
      type: object
      required: [profile]
      properties:
        page_numbers:
          type: array
          items: { type: integer }
          description: Danh sách trang cần OCR lại (rỗng = toàn bộ văn bản)
        profile:
          type: string
          enum: [high_res_binarize, table_optimized, handwritten_vietnamese]
        reason: { type: string }

    ReOcrRequestRecord:
      type: object
      required: [id, document_id, profile, status, created_at]
      properties:
        id: { type: string }
        document_id: { type: string }
        profile: { type: string }
        page_numbers:
          type: array
          items: { type: integer }
        status: { type: string, enum: [pending, processing, completed, failed] }
        requested_by: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    # ── External Approval Schemas ───────────────────────────────────────────
    ExternalApprovalRequest:
      type: object
      required: [provider, approver_email]
      properties:
        provider:
          type: string
          enum: [docusign, sap_ariba, corporate_sso]
        approver_email: { type: string, format: email }
        approver_name: { type: string }
        expires_in_hours: { type: integer, default: 72 }
        notes: { type: string }

    ExternalApprovalGrant:
      type: object
      required: [id, dossier_id, provider, status, created_at]
      properties:
        id: { type: string }
        dossier_id: { type: string }
        provider: { type: string }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        approver_email: { type: string }
        external_reference_id: { type: string, nullable: true }
        digital_signature_hash: { type: string, nullable: true }
        granted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ExternalApprovalCallbackPayload:
      type: object
      required: [grant_id, status]
      properties:
        grant_id: { type: string }
        status: { type: string, enum: [approved, rejected] }
        external_reference_id: { type: string }
        digital_signature_hash: { type: string, nullable: true }
        signature_certificate: { type: string, nullable: true }
        signed_at: { type: string, format: date-time }

    # ── Review Revision Schemas (Append-only) ────────────────────────────────
    ReviewItemRevision:
      type: object
      required: [revision_number, action, author_user_id, created_at]
      properties:
        revision_number: { type: integer }
        action:
          type: string
          enum: [confirm, correct, reject, needs_more_evidence]
        author_user_id: { type: string }
        author_role: { type: string }
        comment: { type: string, nullable: true }
        corrected_value: { type: object, nullable: true }
        corrected_bbox:
          type: array
          items: { type: number }
          nullable: true
        previous_version: { type: integer }
        created_at: { type: string, format: date-time }

    # ── Optimization Schemas ────────────────────────────────────────────────
    OptimizationCampaign:
      type: object
      required: [campaign_id, name, target_metric, status, created_at]
      properties:
        campaign_id: { type: string }
        name: { type: string }
        description: { type: string }
        target_metric: { type: string, enum: [f1_score, precision, latency, cost] }
        baseline_score: { type: number }
        current_best_score: { type: number, nullable: true }
        status: { type: string, enum: [active, completed, archived] }
        created_at: { type: string, format: date-time }

    CreateCampaignRequest:
      type: object
      required: [name, target_metric, baseline_score]
      properties:
        name: { type: string }
        description: { type: string }
        target_metric: { type: string, enum: [f1_score, precision, latency, cost] }
        baseline_score: { type: number }

    OptimizationCandidate:
      type: object
      required: [candidate_id, campaign_id, prompt_template, is_active_production, created_at]
      properties:
        candidate_id: { type: string }
        campaign_id: { type: string }
        name: { type: string }
        prompt_template: { type: string }
        model_name: { type: string }
        temperature: { type: number }
        is_active_production: { type: boolean }
        benchmark_f1: { type: number, nullable: true }
        created_at: { type: string, format: date-time }

    CreateCandidateRequest:
      type: object
      required: [campaign_id, name, prompt_template, model_name]
      properties:
        campaign_id: { type: string }
        name: { type: string }
        prompt_template: { type: string }
        model_name: { type: string }
        temperature: { type: number, default: 0.0 }

    OptimizationExperiment:
      type: object
      required: [experiment_id, campaign_id, candidate_id, golden_dataset_version, status, created_at]
      properties:
        experiment_id: { type: string }
        campaign_id: { type: string }
        candidate_id: { type: string }
        golden_dataset_version: { type: string }
        status: { type: string, enum: [configured, running, completed, failed] }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    CreateExperimentRequest:
      type: object
      required: [campaign_id, candidate_id, golden_dataset_version]
      properties:
        campaign_id: { type: string }
        candidate_id: { type: string }
        golden_dataset_version: { type: string }
        sample_size: { type: integer, default: 100 }

    ExperimentResult:
      type: object
      required: [experiment_id, f1_score, precision, recall, avg_latency_ms, total_cost_usd]
      properties:
        experiment_id: { type: string }
        f1_score: { type: number }
        precision: { type: number }
        recall: { type: number }
        avg_latency_ms: { type: number }
        total_cost_usd: { type: number }
        eval_items_count: { type: integer }
        breakdown_by_clause_type:
          type: object
          additionalProperties: { type: number }

    # ── Enterprise Envelopes ────────────────────────────────────────────────
    ApiEnvelopeDocument:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/DocumentDetail' }

    ApiEnvelopeDocumentList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/DocumentListItem' }

    ApiEnvelopeManifest:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/DossierManifest' }

    ApiEnvelopePipelineRun:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/PipelineRunSummary' }

    ApiEnvelopePipelineRunList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/PipelineRunSummary' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    ApiEnvelopePipelineRunDetail:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/PipelineRunDetail' }

    ApiEnvelopeBatchList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/BatchListItem' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    ApiEnvelopeBatchDetail:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/BatchDetail' }

    ApiEnvelopeReOcrRequest:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ReOcrRequestRecord' }

    ApiEnvelopeReOcrRequestList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/ReOcrRequestRecord' }

    ApiEnvelopeExternalApproval:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ExternalApprovalGrant' }

    ApiEnvelopeExternalApprovalList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/ExternalApprovalGrant' }

    ApiEnvelopeReviewRevisions:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/ReviewItemRevision' }

    ApiEnvelopeCampaign:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/OptimizationCampaign' }

    ApiEnvelopeCampaignList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/OptimizationCampaign' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    ApiEnvelopeCampaignDetail:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/OptimizationCampaign' }

    ApiEnvelopeCandidate:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/OptimizationCandidate' }

    ApiEnvelopeCandidateList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/OptimizationCandidate' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    ApiEnvelopeExperiment:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/OptimizationExperiment' }

    ApiEnvelopeExperimentList:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/OptimizationExperiment' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    ApiEnvelopeExperimentResult:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ExperimentResult' }

  # ── Responses ───────────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Token JWT không hợp lệ, đã hết hạn hoặc không được cung cấp (401)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Không có quyền truy cập theo vai trò x-rbac hoặc không khớp X-Tenant-Id (403)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: Request không hợp lệ (validation, schema)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource không tồn tại
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: File vượt quá giới hạn (mặc định 50 MB)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Bị rate limit (429)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  # ── Security Schemes ─────────────────────────────────────────────────────
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token chuẩn RFC 7519 chứa các claims:
        - `sub`: User ID (ULID)
        - `tenant_id`: Định danh Tenant (bắt buộc khớp với header X-Tenant-Id)
        - `role`: OPERATOR | REVIEWER | ADMINISTRATOR
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
      description: |
        Header định danh Tenant phục vụ phân lập đa khách hàng (Tenant Isolation).
        Bắt buộc phải trùng khớp với claim `tenant_id` trong Bearer JWT.

# ═══════════════════════════════════════════════════════════════════════════
# SECURITY, WEBHOOKS, CALLBACKS
# ═══════════════════════════════════════════════════════════════════════════
security:
  - bearerAuth: []
    tenantHeader: []


webhooks:
  jobStatusChanged:
    post:
      summary: (Tuỳ chọn) Webhook khi job chuyển trạng thái
      description: |
        Internal webhook cho integration test hoặc external system.
        Mặc định client dùng polling `/jobs/{id}` 2-3s/lần (xem DOC-04 8.0).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                job_id: { type: string }
                dossier_id: { type: string }
                from_status: { $ref: '#/components/schemas/JobStatus' }
                to_status: { $ref: '#/components/schemas/JobStatus' }
                trace_id: { type: string }
      responses:
        '200':
          description: Accepted
