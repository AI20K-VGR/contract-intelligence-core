openapi: 3.1.0

info:
  title: Contract Intelligence API
  version: 0.3.0
  status: enterprise-ready — đã chốt kiến trúc Bearer JWT, x-rbac & Tenant Isolation (Sprint 1)
  description: |
    REST API cho Contract Intelligence — hệ thống trích xuất, so sánh và review hợp đồng cấp Enterprise.

    **Khớp kiến trúc:** `docs/DOC-04-architecture.md` (v0.1, 2026-09-16)
    **Khớp schema:** `docs/DOC-04b-postgres-schema.sql` (PostgreSQL v1.0 đã chốt 2026-09-17)

    ## Cơ chế Xác thực & Phân quyền Enterprise
    - **Xác thực (Bearer JWT):** Mọi request (trừ probe `/healthz`, `/readyz`) bắt buộc mang header:
      `Authorization: Bearer <jwt_token>`
      JWT payload mang các claims: `sub` (user_id), `tenant_id`, `role` (`OPERATOR` | `REVIEWER` | `ADMINISTRATOR`).
    - **Tenant Isolation (`X-Tenant-Id`):** Client bắt buộc gửi header `X-Tenant-Id`.
      Backend enforce tenant boundary nghiêm ngặt: `X-Tenant-Id` phải trùng khớp với claim `tenant_id` trong JWT. Mọi thao tác ghi/đọc dữ liệu đều bị cô lập theo tenant.
    - **Phân quyền Role-Based Access Control (`x-rbac`):** Mỗi endpoint quy định chặt chẽ danh sách role hợp lệ qua extension property `x-rbac`:
      - `OPERATOR`: Khởi tạo dossier/batch, upload văn bản, xác nhận manifest, kích hoạt run, tạo yêu cầu Re-OCR.
      - `REVIEWER`: Xem dossier/documents/facts/conflicts/citations, thực hiện review actions, xem lịch sử revision, đề xuất khóa dossier.
      - `ADMINISTRATOR`: Toàn quyền hệ thống + quản lý External Approval Grants, chạy Optimization Campaigns/Experiments, promote prompt candidates, xem Audit/Ops KPI.

    ## Đơn vị xử lý & Nghiệp vụ cốt lõi (9 Phân hệ Enterprise)
    1. **Dossiers:** Quản lý vòng đời dossier (1 hợp đồng chính + 0..n phụ lục), khóa thẩm định, cập nhật metadata, phê duyệt.
    2. **Documents:** Quản lý văn bản vật lý, tải/stream PDF, cấu trúc trang, bbox OCR, cây điều khoản, bảng biểu.
    3. **Manifest Confirmation:** Quy trình xác nhận manifest tài liệu sau upload/OCR (phân loại hợp đồng/phụ lục, số hiệu, ngày ký).
    4. **Runs (Pipeline Runs):** Snapshot thực thi độc lập của pipeline với metrics, stage tracking, huỷ run.
    5. **Batches:** Tải lên ZIP + manifest hàng loạt, tiến độ xử lý song song, retry / resume batch, huỷ batch.
    6. **Re-OCR Requests:** Đặt hàng OCR lại trang hoặc tài liệu với hồ sơ tối ưu riêng (high-res binarization, table mode).
    7. **External Approval Grants:** Tích hợp phê duyệt ngoài (DocuSign, SAP, ERP, Corporate Approval Gate) kèm webhook callback.
    8. **Review Revisions (Append-Only):** Quản lý chuỗi lịch sử phiên bản thẩm tra bất biến (immutable audit log) cho review items.
    9. **Optimization (Campaigns / Candidates / Experiments):** Vòng lặp tự tối ưu hóa prompt, heuristic extraction và benchmark thử nghiệm.

    ## Quy ước chung
    - Tất cả endpoint có tiền tố `/api/v1`
    - Định dạng: JSON UTF-8, thời gian ISO 8601 kèm timezone
    - Lỗi trả về `application/problem+json` (RFC 9457) kèm `code` nội bộ và `trace_id`
    - Phân trang: cursor (`?cursor=&limit=`), mặc định limit=50, tối đa 200
    - Header phản hồi `X-Trace-Id` để debug
    - Header `Idempotency-Key` cho các mutation POST quan trọng
    - Tài liệu OpenAPI UI: `GET /docs` (Swagger UI), `GET /redoc`

    ## Optimistic concurrency cho review
    Mọi API trả về fact/finding/clause… ở chế độ "effective" đều kèm `current_version`.
    Khi reviewer submit action, client phải gửi `base_version`.
    Mismatch giữa `base_version` của client và version hiện tại trong DB → API trả `409 Conflict` kèm state mới nhất để client refetch/retry.

  contact:
    name: Contract Intelligence Team — VSF OJT Batch 3
    email: dev@local.test
  license:
    name: Proprietary (OJT)

servers:
  - url: http://localhost:8000/api/v1
    description: Local development (docker compose)
  - url: https://api.contractintel.internal/api/v1
    description: Internal staging (TBD)

# ═══════════════════════════════════════════════════════════════════════════
# TAGS
# ═══════════════════════════════════════════════════════════════════════════
tags:
  - name: dossiers
    description: Quản lý dossier (1 hợp đồng + phụ lục)
  - name: documents
    description: Tài liệu trong dossier, streaming content & metadata
  - name: manifest
    description: Xác nhận manifest tài liệu sau upload / OCR sơ bộ
  - name: runs
    description: Quản lý và theo dõi pipeline execution runs
  - name: jobs
    description: Theo dõi job và retry
  - name: batches
    description: Upload hàng loạt và tóm tắt tiến độ batch
  - name: re-ocr
    description: Yêu cầu OCR lại trang hoặc tài liệu với profile tối ưu
  - name: pages
    description: Trang, ảnh, text layer
  - name: clauses
    description: Cây điều khoản
  - name: tables
    description: Bảng có cấu trúc
  - name: facts
    description: Fact (giá trị trích) + giá trị hiệu lực
  - name: findings
    description: Finding (kết quả so sánh kỹ thuật)
  - name: conflicts
    description: View lấy ra các finding cần reviewer xử lý
  - name: citations
    description: Citation (Tài liệu → Trang → Dòng OCR → Char span → BBox)
  - name: review
    description: Review item và review action (HITL)
  - name: revisions
    description: Lịch sử phiên bản thẩm tra bất biến (append-only review audit log)
  - name: approval
    description: Khóa và phê duyệt nội bộ dossier
  - name: external-approvals
    description: Cấp quyền và xác nhận phê duyệt từ hệ thống bên ngoài (DocuSign, SAP, ERP)
  - name: optimization
    description: Tối ưu hóa prompt / heuristic extraction (Campaigns, Candidates, Experiments)
  - name: audit
    description: Audit trail
  - name: ops
    description: KPI vận hành (throughput, cost, failures)
  - name: health
    description: Health / readiness probe (liveness & readiness)

# ═══════════════════════════════════════════════════════════════════════════
# PATHS
# ═══════════════════════════════════════════════════════════════════════════
paths:

  # ─── Dossiers ────────────────────────────────────────────────────────────
  /dossiers:
    post:
      tags: [dossiers]
      summary: Tạo dossier + upload file hợp đồng/phụ lục
      description: |
        Multipart upload: trường `contract` bắt buộc (1 file), trường `annexes` tuỳ chọn (0..n file).
        Operator gán vai trò bằng thứ tự upload. Toàn bộ dossier/document/job/task được tạo trong **một transaction**.
        Trả `202 Accepted` kèm `dossier_id` và `job_id`.
      operationId: createDossier
      x-rbac: [OPERATOR, ADMINISTRATOR]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DossierUploadRequest'
            encoding:
              contract:
                contentType: application/pdf
              annexes:
                contentType: application/pdf
              metadata:
                contentType: application/json
      responses:
        '202':
          description: Dossier accepted, processing async
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeDossierCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'

    get:
      tags: [dossiers]
      summary: Danh sách dossier
      operationId: listDossiers
      x-rbac: [OPERATOR, REVIEWER, ADMINISTRATOR]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/JobStatus' }
        - name: has_conflicts
          in: query
          schema: { type: boolean }
        - name: batch_id
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Tìm theo tên dossier
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Paginated dossier list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeDossierList'

  /dossiers/{dossier_id}:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    get:
      tags: [dossiers]
      summary: Chi tiết dossier (tài liệu, job mới nhất, tóm tắt)
      operationId: getDossier
      x-rbac: [OPERATOR, REVIEWER, ADMINISTRATOR]
      responses:
        '200':
          description: Dossier detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeDossier'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [dossiers]
      summary: Cập nhật metadata dossier
      description: Cho phép Operator hoặc Admin sửa tên dossier, ghi chú hoặc custom tags.
      operationId: updateDossier
      x-rbac: [OPERATOR, ADMINISTRATOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DossierUpdateRequest'
      responses:
        '200':
          description: Dossier updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeDossier'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /dossiers/{dossier_id}/lock:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    post:
      tags: [dossiers]
      summary: Khóa dossier để thẩm tra (ngăn chặn reprocess hoặc sửa đổi song song)
      operationId: lockDossier
      x-rbac: [REVIEWER, ADMINISTRATOR]
      responses:
        '200':
          description: Dossier locked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeDossier'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Dossier already locked or cannot be locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /dossiers/{dossier_id}/documents:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    get:
      tags: [documents]
      summary: Danh sách toàn bộ văn bản trong dossier (Hợp đồng chính và các phụ lục)
      operationId: listDossierDocuments
      x-rbac: [OPERATOR, REVIEWER, ADMINISTRATOR]
      responses:
        '200':
          description: Document list in dossier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeDocumentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /dossiers/{dossier_id}/manifest:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    get:
      tags: [manifest]
      summary: Lấy manifest dự thảo của dossier sau upload và trích xuất sơ bộ
      operationId: getDossierManifest
      x-rbac: [OPERATOR, REVIEWER, ADMINISTRATOR]
      responses:
        '200':
          description: Manifest details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeManifest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /dossiers/{dossier_id}/manifest/confirm:
    parameters:
      - $ref: '#/components/parameters/DossierId'
      - name: Idempotency-Key
        in: header
        required: false
        schema: { type: string, format: uuid }
    post:
      tags: [manifest]
      summary: Operator xác nhận cấu trúc manifest (chốt vai trò hợp đồng/phụ lục, số hiệu, ngày ký)
      description: |
        Quy trình chuẩn Enterprise: Sau khi hệ thống OCR trang bìa và phát hiện số hiệu,
        Operator thẩm định và chốt lại cấu trúc tài liệu trước khi kích hoạt pipeline so sánh điều khoản.
      operationId: confirmDossierManifest
      x-rbac: [OPERATOR, ADMINISTRATOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmManifestRequest'
      responses:
        '200':
          description: Manifest confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeManifest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Manifest conflict or already confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /dossiers/{dossier_id}/runs:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    post:
      tags: [runs]
      summary: Khởi tạo pipeline execution run mới cho dossier
      description: Tạo snapshot thực thi mới với config override tuỳ chọn (prompt version, OCR profile, confidence threshold).
      operationId: triggerDossierRun
      x-rbac: [OPERATOR, ADMINISTRATOR]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '202':
          description: Pipeline run accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopePipelineRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Pipeline run conflict (run currently active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /dossiers/{dossier_id}/external-approvals:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    get:
      tags: [external-approvals]
      summary: Danh sách external approval grants và trạng thái ký duyệt từ hệ thống bên ngoài
      operationId: listExternalApprovals
      x-rbac: [OPERATOR, REVIEWER, ADMINISTRATOR]
      responses:
        '200':
          description: List of external approval grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeExternalApprovalList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [external-approvals]
      summary: Tạo yêu cầu phê duyệt chuyển tiếp sang hệ thống bên ngoài (DocuSign, SAP, ERP Portal)
      operationId: requestExternalApproval
      x-rbac: [ADMINISTRATOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalApprovalRequest'
      responses:
        '201':
          description: External approval grant created and dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeExternalApproval'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Dossier is not in approved state or grant already pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /dossiers/{dossier_id}/reprocess:
    parameters:
      - $ref: '#/components/parameters/DossierId'
    post:
      tags: [dossiers]
      summary: Tạo job mới cho dossier (chạy lại với cấu hình hiện tại)
      description: |
        Tạo job mới + `pipeline_run` mới, kết quả cũ vẫn còn (bất biến).
        Khi job mới chạy xong, UI sẽ hiển thị kết quả mới nhất; kết quả cũ có thể xem qua `/dossiers/{id}/audit`.
      operationId: reprocessDossier
      x-rbac: [OPERATOR, ADMINISTRATOR]
      responses:
        '202':
          description: Reprocess accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeDossierCreated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Dossier đang có job chạy, không thể reprocess
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ─── Runs ────────────────────────────────────────────────────────────────
  /runs:
    get:
      tags: [runs]
      summary: Danh sách tất cả các pipeline execution runs trong tenant
      operationId: listRuns
      x-rbac: [OPERATOR, REVIEWER, ADMINISTRATOR]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: dossier_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [queued, running, completed, failed, cancelled] }
      responses:
        '200':
          description: List of pipeline runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopePipelineRunList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [runs]
      summary: Chi tiết snapshot pipeline run (metrics, stage tracking, config snapshot, logs)
      operationId: getRunDetail
      x-rbac: [OPERATOR, REVIEWER, ADMINISTRATOR]
      responses:
        '200':
          description: Run detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopePipelineRunDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /runs/{run_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [runs]
      summary: Huỷ bỏ pipeline run đang chạy
      operationId: cancelRun
      x-rbac: [OPERATOR, ADMINISTRATOR]
      responses:
        '200':
          description: Pipeline run cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopePipelineRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Run cannot be cancelled (already completed or failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ─── Jobs ────────────────────────────────────────────────────────────────
  /jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [jobs]
      summary: Trạng thái job, tiến độ theo bước, lỗi, link trace
      operationId: getJob
      x-rbac: [OPERATOR, REVIEWER, ADMINISTRATOR]
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeJob'
        '404':
          $ref: '#/components/responses/NotFound'

  /jobs/{job_id}/retry:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [jobs]
      summary: Retry từ bước lỗi (cùng run)
      operationId: retryJob
      x-rbac: [OPERATOR, ADMINISTRATOR]
      responses:
        '202':
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeJob'
        '409':
          description: Job không ở trạng thái failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ─── Batches ─────────────────────────────────────────────────────────────
  /batches:
    post:
      tags: [batches]
      summary: Tạo batch từ ZIP + manifest.csv
      description: |
        Manifest CSV có cột: `dossier_name, file, role, order`.
        Mỗi dossier trong batch tạo một job độc lập.
      operationId: createBatch
      x-rbac: [OPERATOR, ADMINISTRATOR]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [manifest, archive]
              properties:
                manifest:
                  type: string
                  format: binary
                  description: File manifest.csv
                archive:
                  type: string
                  format: binary
                  description: File ZIP chứa tất cả dossier
      responses:
        '202':
          description: Batch accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeBatchCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [batches]
      summary: Danh sách các batch xử lý hàng loạt trong tenant
      operationId: listBatches
      x-rbac: [OPERATOR, REVIEWER, ADMINISTRATOR]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
