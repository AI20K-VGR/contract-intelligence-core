      - name: page_no
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: level
        in: query
        schema:
          type: string
          enum: [line, word]
          default: line
      - name: run_id
        in: query
        description: Mặc định dùng latest run
