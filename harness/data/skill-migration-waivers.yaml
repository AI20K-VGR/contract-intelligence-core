# Referents a skill's prose stopped naming, each with the reason it may go.
#
# `skill_migration_parity.py check` refuses while any absence here lacks a written
# reason. A reason is prose a HUMAN wrote and another human can disagree with — the
# tool never decides whether an absence is acceptable, it only refuses to let one
# pass unnoticed. A blank reason does not clear the gate, and a waiver naming a
# referent that is still present is reported as STALE (a waiver that outlives its
# absence pre-excuses the next one).
#
# The bar for an entry: the CLI must MEASURABLY cover the same case. "The verb
# probably handles it" is not a reason; a recorded probe is. `covered_by:` is that
# bar as a pointer rather than a paragraph — `<repo-relative path>:<literal needle>`,
# joined by ` || `, the same grammar the decision ledger uses for execution proof.
# test_skill_migration_waiver_ledger.py resolves every one of them.

plan:
  waived:
    plan_layout_check.py:
      covered_by: >-
        harness/scripts/hs_run_plan.py:_attach_layout_warnings ||
        harness/scripts/hs_run_cook.py:_layout_warnings ||
        harness/tests/test_cook_preflight_layout_parity.py:layout_warnings
      reason: >
        The CLI now CALLS it. `hs_run_plan._attach_layout_warnings` runs
        `plan_layout_check.layout_warnings` on every projection and appends the
        result to `warnings`; `hs_run_cook._layout_warnings` does the same inside
        preflight. Both are pinned by `test_cook_preflight_layout_parity.py`,
        whose wiring assertions were each proven to go red when the call is
        removed. The signal stays ADVISORY on both sides — a separate test fails
        if a layout warning is ever allowed to block or to move `state`, since
        the script is exit-0 by construction and the blocking guarantee belongs
        to `plan_approval`'s hash.

        An earlier version of this entry claimed `hs-run plan next` already
        reported `state=unresolved` on an off-layout plan dir. It did not. That
        reading came from a run whose `--root` was swallowed into the plan-dir
        positional (`plans/--root has no plan.md`, `root_source:
        env:HARNESS_DATA_ROOT`) — it measured a different tree. Re-measured on
        one tree with only the stray file differing, `plan next` answered
        `needs_research` with `warnings: []` either way. Both CLIs were blind;
        the prose line was the only thing that knew, and prose that asks a model
        to remember to run a script goes silent exactly when it is forgotten.
