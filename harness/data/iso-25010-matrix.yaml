# ISO/IEC 25010 quality-characteristic coverage — SSOT for the hs:scenario matrix.
#
# Human-edited config. Consumers READ this file for the canonical 8 characteristics
# and the per-tier coverage floors; they never re-hardcode the list (DRY). Characteristic
# names are the ISO/IEC 25010:2011 standard names, kept verbatim (evidence — not translated).
# Adapted from docs/product/_refs/frankcode-src/qa/methodology/qa/iso25010-coverage.md;
# SaaS/tracker references (Linear, PR-comment, Design-Gate-verdict routing) are dropped and
# test layers are mapped to the tier-1 test-type vocabulary.

silent_na: reject   # a cell with no covered/N-A-reason/gap decision is a defect, not "covered"

# Task-risk floors: minimum number of the 8 characteristics that must be `covered`.
risk_floors:
  critical: 8
  high: 6
  medium: 4
  low: 2

characteristics:
  - id: functional_suitability
    name: "Functional Suitability"
    sub_properties: [completeness, correctness, appropriateness]
    typical_layers: [unit, integration]
  - id: performance_efficiency
    name: "Performance Efficiency"
    sub_properties: [time_behavior, resource_use, capacity]
    typical_layers: [load, e2e]
  - id: compatibility
    name: "Compatibility"
    sub_properties: [co_existence, interoperability]
    typical_layers: [contract, integration]
  - id: usability
    name: "Usability"
    sub_properties: [learnability, operability, accessibility, ui_aesthetics]
    typical_layers: [uat, manual]
  - id: reliability
    name: "Reliability"
    sub_properties: [maturity, availability, fault_tolerance, recoverability]
    typical_layers: [integration, regression]
  - id: security
    name: "Security"
    sub_properties: [confidentiality, integrity, non_repudiation, accountability, authenticity]
    typical_layers: [security, integration]
  - id: maintainability
    name: "Maintainability"
    sub_properties: [modularity, reusability, analysability, modifiability, testability]
    typical_layers: [review, unit]
  - id: portability
    name: "Portability"
    sub_properties: [adaptability, installability, replaceability]
    typical_layers: [e2e]
