# ship.yaml — the `ship` domain's fragment of the hs-run registry.
#
# Owned exclusively by whoever builds the `ship` domain's verbs. Never touch
# plan.yaml/cook.yaml or any other domain's fragment from here — one file per
# domain is what lets concurrent build phases own a different domain each
# without two agents writing the same file. Schema + merge/conflict rules:
# see harness/data/hs-run-registry.yaml's header.
#
# `ship` is the highest-risk domain hs-run hosts: every verb here MUST stay
# read-only (report gate state) — never approve, push, or open a PR itself.
# That transport step stays a deliberate model/human decision outside this
# domain's reach, not a missing feature.

domains:
  ship:
    next: {module: hs_run_ship, entry: cmd_gates_check}

# What each STATE needs, delivered at the moment that step begins rather than
# listed in the skill body where it is read once and thousands of tokens early.
#
# The state vocabulary is the whole point of this table for `ship`. The verb used
# to answer every refusal with the single word `blocked` — measured: 31 distinct
# reasons, one word, across 7 groups. A reader learned that something was wrong
# and nothing about what to do next.
#
# The split is by NEXT ACTION, never by reason. That is why 31 reasons became 6
# states and not 31: `receipt_invalid` deliberately absorbs twelve of them,
# because all twelve are resolved by opening the same one file, and splitting a
# state nobody would act on differently is a distinction with no consumer.
step_routing:
  ship:
    skill: ship
    covers_skill: true
    # Two rules govern every step of a ship, not one of them.
    #
    # `verification-mechanism` is the evidence-vs-assumption rule, and it is the
    # one this domain cannot run without: every state here is a claim about what
    # is on disk, and `gates_not_enforced` exists precisely because a claim of
    # "clear" was being read as a claim of "checked".
    #
    # `agent-operational-discipline` is the probe-before-you-build home rule. The
    # gates in this domain are self-approvable, so an agent's belief about what a
    # gate would say is worth nothing next to running it.
    always:
      rules: [verification-mechanism, agent-operational-discipline]
    states:
      # ── repeating has stopped being an attempt ────────────────────────────
      # Raised by the ENGINE, not by this domain: the same answer has come back
      # often enough that another identical run is not new evidence. The domain's
      # own answer rides as `domain_state` — counsel about the wrong problem is
      # worse than none, so the finding has to stay readable.
      stuck:
        summary: >-
          This domain has answered the same thing enough times in a row that repeating
          it is no longer an attempt. Stop re-running and spawn `escalation-consultant`
          for counsel — hand it the task, the evidence as file:line, what was already
          tried, and the specific question. It advises; the decision stays here.
        rules: [orchestration-protocol, agent-operational-discipline]
      ready:
        summary: >-
          The push-stage gate checked what it requires and found nothing missing.
          That is the input to the human confirm, never a substitute for it — the
          gates here are self-approvable, so `ready` is the one moment the
          discipline depends entirely on the person.
        # The ledger rides HERE rather than in `always`, and this is the state
        # where it is actually spent: everything after `ready` — the commit
        # message, the version bump, the changelog — is decided autonomously by
        # design ("When NOT to ask"), which is exactly the class of decision that
        # owes a written line. At the refusal states there is no autonomous
        # decision being made yet, only a gap to close.
        rules: [auto-decision-ledger]
        refs: [references/release-notes.md]
      gates_not_enforced:
        summary: >-
          The stage policy requires no receipt at all here, so nothing was
          checked. "Clear" means nobody asked, not that you are covered — the
          local posture is generate-here, enforce-in-CI, and this state says so
          out loud instead of letting an empty tree read as a passing one.
        # No pointer. The reader does not have a gap to close — they have a
        # sentence to understand, and `verification-mechanism` in `always` is
        # already the rule that draws the evidence-vs-assumption line this state
        # is an instance of. A drawer here would be reading for its own sake.
      no_plan_resolved:
        summary: >-
          No plan could be anchored: none exists, none is `in_progress`, or two
          are and the resolver refuses to guess between them. The fix is in
          `plans/` or in the environment — never in a receipt, which is why this
          is not the same state as a receipt problem.
        refs: [references/preflight-checklist.md]
      receipt_missing:
        summary: >-
          A receipt the stage requires was never produced (or resolves outside
          the plan's own artifacts dir, which is the same thing as absent for a
          gate that will not read through an escape). Produce it with the tool
          that owns it; do not hand-write a receipt to clear a gate.
        rules: [plannotator-review-gates]
        refs: [references/gate-sequence.md]
      receipt_invalid:
        summary: >-
          The receipt is on disk and unusable — unparseable, missing a required
          field, naming another plan, carrying a failing check, or a verdict the
          stage does not accept. The envelope carries the gate's own reason
          verbatim; open that one file and fix what it names.
        rules: [plannotator-review-gates]
        refs: [references/gate-sequence.md]
      policy_broken:
        summary: >-
          The gate configuration contradicts itself — a `requires:` naming an
          artifact kind that does not exist, a stage floor switched on but
          unreadable, or a rule-scan whose own verdict disagrees with its
          findings. Fix the CONFIGURATION. Chasing this in the receipts is a
          loop that never goes green.
        refs: [references/gate-sequence.md]
      needs_architecture_review:
        summary: >-
          Every receipt is present and the gate still refuses, for a reason that is
          not a configuration fault: the diff is structural and the review-decision
          carries no architecture_review.checked. Reachable only on a protected
          branch, where the gate runs `merge` (which requires review-decision) rather
          than `push` (which does not). Load docs/system-architecture.md, judge the
          drift, and re-record the review-decision with
          --architecture-checked — this is a receipt you can write, not a config
          file to go edit.
        rules: [architectural-constraints]
        docs: [docs/system-architecture.md]
