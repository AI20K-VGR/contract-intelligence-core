# review.yaml — the `review` domain's fragment of the hs-run registry.
#
# Owned exclusively by whoever builds the `review` domain's verbs. Never touch
# plan.yaml/cook.yaml/test.yaml or any other domain's fragment from here — one
# file per domain is what lets domains be built concurrently without two
# agents writing the same file. Schema + merge/conflict rules: see
# harness/data/hs-run-registry.yaml's header.

domains:
  review:
    next: {module: hs_run_review, entry: cmd_next}

# `skill:` and the domain name diverge here — this is the case that key exists for.
step_routing:
  review:
    skill: code-review
    covers_skill: true

    # No `always:` block, and the absence is a decision. Everything listed there is
    # charged to EVERY state's document budget, and this domain needs its five slots at
    # `ready_recall`, where the fan-out paperwork lands. A rule useful at all three
    # states would have to be worth its cost at `nothing_changed` too, where the answer
    # is "there is nothing to review".

    states:
      # ── repeating has stopped being an attempt ────────────────────────────
      # Raised by the ENGINE, not by this domain: the same answer has come back
      # often enough that another identical run is not new evidence. The domain's
      # own answer rides as `domain_state` — counsel about the wrong problem is
      # worse than none, so the finding has to stay readable.
      stuck:
        summary: >-
          This domain has answered the same thing enough times in a row that repeating
          it is no longer an attempt. Stop re-running and spawn `escalation-consultant`
          for counsel — hand it the task, the evidence as file:line, what was already
          tried, and the specific question. It advises; the decision stays here.
        rules: [orchestration-protocol, agent-operational-discipline]
      # ── one reviewer, one pass (effort `low`) ────────────────────────────────────
      # A review reads universal/absence claims ("no PII in logs") that a behavioural
      # test cannot express, and methodology-review is the one gate that fires when the
      # thing under review is the methodology itself.
      #
      # scoring-rigor-contract's own first line names this step: "load when
      # hs:critique's consolidator ranks findings, or hs:code-review's truth-table
      # adjudicates one". Adjudicating a finding is what this state leads to, and the
      # failure it prevents — a fourth competing severity vocabulary invented on the
      # spot — happens exactly while the verdict is being written.
      ready:
        summary: >-
          The diff is prepared and ONE reviewer judges it in a single pass. The envelope
          carries the scope, the rules that govern these exact files, and the risk tier.
        rules: [claim-verification, methodology-review, anti-tautology-detection,
                scoring-rigor-contract]
        # The verb names the operational rules that govern THESE files, and any that
        # actually fired, in `artifacts[0].standards`. A reviewer that reads only the
        # count is reviewing against rules it never opened.
        advisory: >-
          Read artifacts[0].standards.critical before judging the diff — those rule ids
          govern these exact files. Any entry in warnings prefixed with a rule id is a
          detector that FIRED and must be answered, not summarised.

      # ── the review fans out (effort medium and up) ───────────────────────────────
      # The four rules the body used to name are here rather than at `ready`, and the
      # split is why they fit at all: eight rules do not go into one state's budget of
      # five. Each earns its place on THIS side of the fork.
      #
      #   orchestration-protocol — the fan-out is about to happen. Sizing, groupCap,
      #     earlyWrite: all of it applies at the moment before a spawn and nowhere else.
      #   output-rendering — a fan-out produces a report per lens plus a consolidation,
      #     so the register/language contract is load-bearing here in a way it is not
      #     for one reviewer writing one verdict.
      #   auto-decision-ledger — spawning subagents to self-adjudicate findings IS
      #     acting autonomously. At `low` a human is reading each finding as it lands.
      #   observation-signal-emit — the end-of-work signal is emitted once per run, and
      #     a fanned-out run is the one where a checkpoint is easy to skip.
      ready_recall:
        summary: >-
          Same prepared diff, but effort is medium or higher, so the review fans out to
          subagents. Orchestration comes before any spawn; the recall ladder produces the
          findings; the verdict, gate and dismissals path are unchanged.
        rules: [orchestration-protocol, output-rendering, auto-decision-ledger,
                observation-signal-emit]
        refs: [references/recall-mode.md]
        advisory: >-
          Route through hs:workflow-orchestrate BEFORE any spawn, then read
          artifacts[0].standards.critical — the same rule ids govern the diff whether one
          reviewer reads them or six do.

      # Told HERE rather than at the pr/ship gate that enforces it. The gate fires
      # a whole review cycle later, so a reviewer who was not briefed pays the
      # round trip to discover the diff owed an architecture pass. The glob set is
      # per-project and not inferable — this repo's is `harness/hooks/**` +
      # `harness/scripts/**`, where a reader would guess `src/**` — which is the
      # shape a state is for: something an agent cannot know and would get wrong.
      needs_architecture_review:
        summary: >-
          The pending diff touches a path standards.yaml calls structural. Judge it
          against the component map and layer boundaries, and record
          architecture_review{checked, doc_sha, drift[]} in the review-decision —
          the pr/ship gate refuses the plan without it.
        rules: [architectural-constraints]
        docs: [docs/system-architecture.md]
        # A diff can be structural AND high-effort at once, and those are two
        # different questions: the first is about the paths, the second about how
        # much recall the run was asked for. This state used to answer only the
        # first, so a structural diff at `--max` produced an envelope identical to
        # the same diff at `--low` — measured, the reviewer lost 4 rules and 1
        # reference, `orchestration-protocol` among them, which is the one that
        # says how a high-effort review fans out. A run asked for maximum recall
        # then quietly ran a single pass.
        #
        # Behind a FLAG rather than in `rules:` unconditionally: on a low-effort
        # structural diff those five are noise, and hanging them on the state
        # would load them on every structural run ever made. The verb sets the
        # flag only on the branch that is not single-pass, so the low-effort
        # budget stays at 2.
        #
        # THREE rules, not the four `ready_recall` carries. The budget for this
        # state is 6 and the unconditional half already spends 2, so one of the
        # five had to go. Dropped `output-rendering`: it governs how the finished
        # report is FORMATTED, while the other four govern how the review is RUN —
        # fan-out shape, the decision trail, and the closing signal. A reviewer who
        # never reads it writes a report in the wrong register; a reviewer who
        # never reads `orchestration-protocol` runs a single pass and calls it a
        # maximum-recall review. Measured across the whole table: all four are
        # routed in `review` at exactly two states, `ready_recall` and this one,
        # which are mutually exclusive — so nothing here is picked up elsewhere in
        # the same run, and the choice is a real loss rather than a duplicate.
        when_flag:
          recall:
            rules: [orchestration-protocol, auto-decision-ledger,
                    observation-signal-emit]
            refs: [references/recall-mode.md]

      # Two states that route nothing, and the reason is the same for both: there is no
      # review to prepare for, so a document would arrive at a dead end rather than at a
      # step. Both are named in the routing gate's per-domain waiver, with these reasons.
      # A refusal, not a mode. The three history modes read git history; this verb
      # reads the working tree, so naming the mode as a state would turn a silent
      # wrong answer into a labelled one. It says which door, and stops.
      wrong_door:
        summary: >-
          The argument names a PR, a commit, or the whole codebase — all history
          questions. This verb reads the WORKING TREE and would answer about a
          different diff. `review_recall.py --effort <level>` serves those modes.

      nothing_changed:
        summary: >-
          The working tree has nothing to judge. The run is over at exit 0.
      git_diff_failed:
        summary: >-
          git could not answer, so there is no diff and no review. The envelope's
          warnings carry the repair; a review rule cannot help with a broken repository.
