# review-pr.yaml — the `review-pr` domain's fragment of the hs-run registry.
#
# One file per domain (schema + merge/conflict rules: see
# harness/data/hs-run-registry.yaml's header) — never add a second domain's
# verbs to this file.

domains:
  review-pr:
    next: {module: hs_run_review_pr, entry: cmd_next}

step_routing:
  review-pr:
    skill: review-pr
    covers_skill: true
    # No `always:` block, deliberately. It is concatenated into EVERY state, and
    # the one rule that looked like a candidate (`verification-mechanism`) would
    # have pushed `ci_done` — already at the budget of 5 — to 6. A rule that
    # costs a document at ten states to be right at two is not an always rule.
    states:
      # ── repeating has stopped being an attempt ────────────────────────────
      # Raised by the ENGINE, not by this domain: the same answer has come back
      # often enough that another identical run is not new evidence. The domain's
      # own answer rides as `domain_state` — counsel about the wrong problem is
      # worse than none, so the finding has to stay readable.
      stuck:
        summary: >-
          This domain has answered the same thing enough times in a row that repeating
          it is no longer an attempt. Stop re-running and spawn `escalation-consultant`
          for counsel — hand it the task, the evidence as file:line, what was already
          tried, and the specific question. It advises; the decision stays here.
        rules: [orchestration-protocol, agent-operational-discipline]
      # --- the answer the caller was polling FOR ---
      ci_done:
        summary: >-
          Every check reached a terminal state and every one of them passed. That is a
          fact about CI, not a verdict on the PR: the diff has still not been read, and
          green CI is the weakest evidence in the review because it only says the tests
          that exist did not fail.
        rules: [claim-verification, anti-tautology-detection, scoring-rigor-contract]
        refs: [references/mandatory-gates.md, references/anti-ai-slop.md]
      ci_failed:
        summary: >-
          A check finished and did not pass. Whether that failure is transient is a
          judgment this verb never makes and never authorises — rerunning to make a
          deterministic failure disappear is the move these rules exist to stop.
        rules: [verification-mechanism, auto-decision-ledger]
      # --- the five states where the run stopped before it learned anything ---
      # All five are "the tooling could not answer", and all five are resolved by
      # the same drawer: which CLI this repo's remote implies, how to check it is
      # installed and authenticated, and the rule that an unresolved forge is a
      # question for the user rather than a guess. Before this table these five
      # carried NO pointer at all — the forge drawer was named once in the body,
      # thousands of tokens before the run reached any of them.
      unknown_forge:
        summary: >-
          The remote names neither github nor gitlab, so no CLI can be chosen. Ask which
          forge this is; do not guess, because a wrong-forge command is worse than a
          question.
        refs: [references/forge-detection.md]
      cli_unavailable:
        summary: >-
          The forge was identified but its CLI is not installed. Nothing about the PR has
          been read yet — this is a machine that cannot ask, not a PR that has no answer.
        refs: [references/forge-detection.md]
      cli_unauthenticated:
        summary: >-
          The CLI is installed and refuses to answer without credentials. Kept separate
          from "still running" on purpose: an auth problem polled as if it were slow CI
          spins until the ceiling and then reports a timeout.
        refs: [references/forge-detection.md]
      ci_check_failed:
        summary: >-
          The forge CLI itself failed — a network, permission or API error, not a failing
          check. The envelope's warnings carry what it said; nothing has been learned
          about the PR's CI either way.
        refs: [references/forge-detection.md]
      no_checks_found:
        summary: >-
          The forge reports no checks at all. An empty result, never a passing one: it
          means either no PR/MR exists for what was asked, or this project runs no CI —
          two different situations that both leave the review with no CI evidence.
        refs: [references/forge-detection.md]
      # --- the three that route nothing, each for its own stated reason ---
      ci_pending:
        summary: >-
          At least one check is still running. Run the printed command again after the
          stated wait; the CLI owns the round count and the ceiling, so neither is
          re-derived by hand.
      ci_timeout:
        summary: >-
          The polling ceiling was reached with checks still unfinished. This is where the
          loop hands back to a human — escalate rather than starting a fresh count, which
          is the one move that makes a ceiling meaningless.
      error:
        summary: >-
          The invocation itself was wrong — a missing or malformed flag. Nothing was read
          and nothing was decided; fix the command line and re-run.
