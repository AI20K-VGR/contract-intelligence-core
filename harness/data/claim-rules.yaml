# claim-rules.yaml — human-edited SSOT for deterministic claim verification.
#
# A rule verifies a universal/absence/structural claim that a behavioral test cannot
# express ("every X has Y", "no X anywhere") by full-scope enumeration (never
# sampling), asserting a condition on every match, and reporting file:line evidence.
# Engine: harness/scripts/claim_verify.py. Prose: harness/rules/claim-verification.md.
#
# Rule spec fields (all required unless noted):
#   id        — stable identifier, e.g. RUL-no-print-in-hooks
#   text      — the claim in plain language
#   scope     — codebase | module | fileset (which files get enumerated)
#   path      — (module: subdirectory; fileset: glob pattern) — required for fileset
#   file_glob — (optional) file pattern filter for codebase/module scope,
#               default "**/*.py"
#   match     — regex; every line matching it is one enumeration unit
#   assert    — regex; a leading "!" negates it (must NOT appear in the match window)
#   context   — (optional) lines of context before+after the match line included in
#               the assert window, default 0 (match line only)
#   severity  — block | advisory
#
# Seed rules below are deliberately conservative examples (advisory-first locally,
# per rule-based-verification.md:44-48) — add new rules by editing this file, never
# by editing claim_verify.py.

rules:
  - id: RUL-no-print-in-hooks
    text: "No stray print( calls in harness/hooks (hooks should use structured logging, not stdout prints)"
    scope: module
    path: harness/hooks
    match: 'print\('
    assert: 'print\('
    severity: advisory

  - id: RUL-no-pii-in-log-calls
    text: "No password/email/secret literal argument in a log.*(...) call"
    scope: codebase
    file_glob: "harness/scripts/**/*.py"
    match: 'log(?:ger)?\.\w+\('
    assert: '!(password|email|secret)\s*='
    severity: advisory
