# grid-strength.yaml — Grid STRENGTH (breadth) SSOT (tầng-1). SONG SONG với
# grid-density-tier.yaml (depth) — KHÔNG merge 2 file. Strength = độ-RỘNG
# (thang t-phủ / covering-array strength), density_tier = độ-SÂU (coverage floor).
#
# KHÔNG chứa bất kỳ nút token-derived nào — đây là harness chạy TRONG Claude
# Code, không đo được token; `guardrail_rows` là cổng PHẠM-VI đếm SỐ HÀNG (tất
# định, 0-token).
strength_ladder: # skeleton.py đọc: t = strength covering-array (phủ t-tuple)
  t2:
    strength: 2
    default: true
    # TÍNH: mọi CẶP giá-trị (2 trục bất kỳ) xuất hiện ≥1 hàng. KHÔNG TÍNH:
    # bộ-ba trở lên.
  t3:
    strength: 3
    default: true
    # TÍNH: mọi BỘ-BA giá-trị (3 trục) xuất hiện ≥1 hàng.
  # t4/t5: present-but-off — mở qua cost-table §2 khi user chọn. Ship nấc
  # ĐỀU uniform (boost BỎ).
guardrail_rows: 200 # costing.py đọc: cổng PHẠM-VI đếm SỐ HÀNG (tất định,
                    # 0-token). 200 = điểm khởi hợp lý, tunable, KHÔNG thiêng.
                    # Vỡ → cost-table + hỏi.
boost_axes: [] # BỎ boost (boost không mua điểm hữu ích). Placeholder rỗng.
na_ratio_bell: 0.30 # na-option3 đọc: tỷ-lệ ô N/A vượt ngưỡng → CHUÔNG
                    # advisory (không gate).
na_ratio_refit: 0.66 # review.py đọc: ngưỡng "tường N/A thảm-hoạ". Vượt ngưỡng
                    # NÀY mà KHÔNG có receipt chọn-trục (grid-axis-src.json) →
                    # finding AXIS_FITNESS advisory, nêu đích danh @grid-axis-
                    # selector (trục nhiều khả năng sai dự án). CAO hơn hẳn
                    # na_ratio_bell (0.30 = chuông thường cho MỌI grid mỏng);
                    # 0.66 ≈ "2/3+ ô N/A", gần chắc trục-canned dùng chưa tỉa.
                    # KHÔNG trùng coverage_floor {0.60,0.85,0.95} (floor-literal
                    # guard). Tunable, không thiêng.
strong_tier_keywords: # SỐT DUY NHẤT (keyword-lint đọc qua
                    # axes.strength_config() → expander.load_strong_tier_keywords()).
                    # expander.py TỪNG có bản Python literal verbatim
                    # (STRONG_TIER_KEYWORDS) tại thời axes.py; đã GỠ hẳn (không
                    # còn bản sao code nào) khi pre-hoc tier-router được thay
                    # bằng post-hoc keyword lint.
  - security
  - arch
  - performance
  - auth
  - crypto
  - cryptography
  - concurrency
  - race
  - deadlock
  - memory
  - unsafe
  - kernel
  - compliance
  - gdpr
  - hipaa
  - pci
  - sso
  - oauth
  - encryption
