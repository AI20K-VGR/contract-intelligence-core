# runtime-targets.yaml — what each coding-agent runtime can actually carry.
#
# Read by harness/scripts/target_projection.py to decide, per hook registration
# group in hook-dispatch.yaml, what survives on a given runtime.
#
# ── Why this file exists at all ────────────────────────────────────────────────
# The upstream product this pattern was studied from negotiates the same thing in
# a hardcoded string table inside its compiled binary. Nothing reads it, nothing
# tests it, and its own emitted output disagrees with itself. Putting the table in
# data makes the projection assertable and lets a wrong entry be corrected by
# editing one line instead of shipping a binary.
#
# ── Atom states — the distinction that carries the honesty ─────────────────────
#   tool_atoms          the runtime HAS these; a matcher naming one matches
#   unsupported_atoms   the runtime is KNOWN not to have these; matching is
#                       impossible and the projection may say so with confidence
#   anything else       UNKNOWN — not yet measured on this runtime
#
# UNKNOWN is not a synonym for unsupported. A gate projected onto an unknown atom
# might fire, or might be inert, and there is no way to tell from here — so the
# projection refuses a compliance gate on an unknown atom for the same reason it
# refuses one on an unsupported atom: an unproven gate reads exactly like a
# working one. Measuring the atom is what clears it, not asserting it.
#
# ── event_wildcard ────────────────────────────────────────────────────────────
# Some runtimes reject `*` and want their own enum. `null` = the runtime accepts a
# bare wildcard; a list = the concrete values `*` becomes there.

schema_version: "1.0"

targets:

  claude-code:
    id: claude-code
    placement:
      scope: project
      hook_file: .claude/settings.json
      skills_dir: .claude/skills
      agents_dir: .claude/agents
      instructions_file: CLAUDE.md
    hook_format: {event_case: pascal, nesting: grouped, command_form: string,
                  root_env: CLAUDE_PLUGIN_ROOT}
    description: >-
      The harness's native runtime. Every atom here is exercised by the live
      install, so this entry doubles as the control: a projection onto
      claude-code that loses anything means the projector is wrong, not the
      runtime.
    evidence: >-
      harness/data/hook-dispatch.yaml is the registration SSOT and every group in
      it runs on this runtime today; the event list is the set of events that
      file registers on, cross-read against the live .claude/settings.json the
      installer materialises.
    events:
      - PreToolUse
      - PostToolUse
      - UserPromptSubmit
      - SessionStart
      - Stop
      - SubagentStart
      - SubagentStop
      - PreCompact
      - Notification
      - UserPromptExpansion
    tool_atoms:
      - Bash
      - Read
      - Write
      - Edit
      - MultiEdit
      - NotebookRead
      - NotebookEdit
      - Glob
      - Grep
      - WebFetch
      - WebSearch
      - Agent
      - Task
      - Skill
      - Workflow
      - TodoWrite
      - TodoRead
    unsupported_atoms: []
    event_wildcard:
      PreToolUse: null
      PostToolUse: null
      UserPromptSubmit: null
      SessionStart: null
      Stop: null
      SubagentStart: null
      SubagentStop: null
      PreCompact: null
      Notification: null
      UserPromptExpansion: null

  codex:
    id: codex
    placement:
      scope: project
      hook_file: .codex/hooks.json
      skills_dir: .codex/skills
      agents_dir: .codex/agents
      instructions_file: AGENTS.md
    hook_format: {event_case: pascal, nesting: grouped, command_form: string,
                  root_env: null, windows_variant: commandWindows}
    description: >-
      OpenAI Codex CLI. Its hook surface is NOT a subset of Claude Code's — it
      adds permissionRequest, postCompact and sessionEnd, and its hook handlers
      can be an agent or a prompt, not only a command.
    evidence: >-
      Events are the `HookEventName` enum in the protocol schema generated by
      `codex app-server generate-json-schema` (codex 0.149.1). The tool atoms are
      NOT in that schema; they were measured directly against codex-cli 0.149.1 by
      scripting the model's reply from a local endpoint and reading the hook's
      stdin — see plans/reports/probe-260824-2145-codex-hook-payload-and-tool-
      vocabulary-report.md, which carries the captured payloads.
    # The schema spells the events camelCase, but a hooks.json written with Claude
    # Code's PascalCase keys is ACCEPTED and normalised: `hooks/list` over the
    # app-server returns eventName "preToolUse" with warnings [] and errors [].
    # So our registrations carry over verbatim and nothing has to be rewritten.
    events:
      - PreToolUse
      - PostToolUse
      - UserPromptSubmit
      - SessionStart
      - Stop
      - SubagentStart
      - SubagentStop
      - PreCompact
      # MEASURED. Codex fires this when a command asks to escalate out of its
      # sandbox, and a hook there can answer allow or deny. Reaching it needs BOTH
      # `sandbox_permissions: "require_escalated"` on the call and `--approve-for-me`
      # on the invocation; either alone leaves permission_mode "bypassPermissions"
      # and the event never fires. Payload is the same Claude-shaped record, with
      # tool_name "Bash" — so this is a gate on the ESCALATION, not a path-typed
      # write event. Deny verified end to end, with an allow as the positive control.
      - PermissionRequest
    # Codex additionally supports postCompact / sessionEnd, which the harness does
    # not register on today. Listed here so a future registration finds them already
    # declared rather than assumed absent:
    extra_events:
      - PostCompact
      - SessionEnd
    tool_atoms:
      # Census of the tools[] array the runtime sends the model, each one then
      # INVOKED and its hook payload read. Everything here fired both PreToolUse and
      # PostToolUse under a wildcard registration.
      - Bash                 # `exec_command`, translated to this name at the boundary
      - update_plan
      - view_image
      - request_user_input   # the AskUserQuestion analogue, same contract
      - create_goal
      - get_goal
      - update_goal
    caveats:
      hook_trust: >-
        Writing the hooks file does not install the hooks. On this runtime a hook
        arrives untrusted, pinned to a hash of its own content, and does not run until
        it is trusted — an edit to the file un-trusts it again. Grant trust through
        the runtime's own interactive startup review, and treat the install as
        unfinished until you have. The only non-interactive override is the
        per-invocation flag --dangerously-bypass-hook-trust; the config key
        `bypass_hook_trust` parses and does nothing.
    unhooked_atoms:
      # MEASURED, and the most load-bearing line in this file: a tool that RUNS while
      # no hook event is raised. It is worse than an absent tool, because the gate on
      # the neighbouring tool still passes and the install reads as covered.
      write_stdin: >-
        writes into a session that `exec_command` opened with `tty: true`, and raises
        no hook event at all. Measured with a wildcard PreToolUse+PostToolUse
        registration: the string `rm -rf /tmp/probe-canary` sent through
        `exec_command` reached the hook 1/1 times; the SAME string typed into a live
        `bash` session through `write_stdin` reached it 0/1 times, the only hook
        payload of the run being `{"command": "bash"}`. So one `exec_command` with
        `tty: true` puts every later command past every gate registered on Bash.
    unsupported_atoms:
      # Census of tools[] across every config probed: Codex declares NO read, write
      # or edit tool. It touches files through the shell, which is why such actions
      # reach a hook as Bash. This is a capability gap, not a naming one — renaming
      # a Write matcher cannot make it fire.
      - Read
      - NotebookRead
      - NotebookEdit
      - Write
      - Edit
      - MultiEdit
      - Glob
      - Grep
      - TodoWrite
      - TodoRead
    # Agent, Task, Skill, Workflow and WebSearch are deliberately in NEITHER list.
    # `multi_agent_v1` and `web_search` are declared to the model, but neither could
    # be invoked in the probe, so their hook-side tool_name is unobserved. Calling
    # them absent would be as unfounded as calling them present, and the projection
    # refuses a compliance gate on an unknown atom for exactly that reason.
    # All null: `matcher: null` was MEASURED as accepted (hooks/list returns the
    # entry with warnings [] and errors []). SessionStart once carried an enum
    # here on the theory that codex rejects a bare wildcard — that was inference,
    # never a measurement, and inference is what produced a wrong capability table
    # for this same target once already. An enum belongs here only after a run
    # shows codex rejecting the alternative.
    event_wildcard:
      PreToolUse: null
      PostToolUse: null
      UserPromptSubmit: null
      SessionStart: null
      Stop: null
      SubagentStart: null
      SubagentStop: null
      PreCompact: null
    # ── Sub-agents: what ports and what does not ──────────────────────────────
    # CORRECTED. The first pass here read `spawn_agent`'s parameters on a config with
    # NO agents defined, found no `agent_type`, and recorded "no named registry". The
    # parameter only appears once at least one valid role exists — absence reflected an
    # empty registry, not an absent capability.
    #
    # Measured: a role is a TOML file under the runtime's `agents/` directory carrying
    # `name`, `description` and a non-blank `developer_instructions`. All three are
    # required; a role missing any is DROPPED WITH A WARNING, not an error. (The kit
    # this pattern was studied from omits `description` on all 16 of its emitted roles,
    # so the current runtime ignores every one of them.) Defining a role makes
    # `agent_type` a spawn parameter, listed alongside the built-in `default`,
    # `explorer` and `worker`.
    #
    #   ports      the prose (`developer_instructions`), the description, and the
    #              effort bound (`model_reasoning_effort` — low|medium|high|xhigh|max
    #              exist on both sides)
    #   does NOT   the MODEL tier. haiku/sonnet/opus/fable have no counterpart, and any
    #              mapping is an invention that would read as the bound being honoured.
    #              `model_tier_map` below is deliberately EMPTY: fill it only when a
    #              human has chosen the equivalences. Until then no `model` key is
    #              emitted and a spawned role inherits the parent, which the runtime
    #              itself names as the preferred default.
    #   does NOT   the per-agent TOOL allowlist. Nothing in the role schema restricts a
    #              sub-agent's tools, so the cage agent_rbac_guard and model_guard
    #              enforce here cannot be reproduced. It is RECORDED as lost — never
    #              embedded in the prose, where it would read like a restriction and
    #              enforce nothing.
    agents:
      named_registry: true
      role_format: toml
      role_dir: agents
      required_keys: [name, description, developer_instructions]
      effort_key: model_reasoning_effort
      tool_allowlist: false
      model_tier_map: {}

  # ─────────────────────────────────────────────────────────────────────────────
  # The seven below were measured on 2026-08-25 from trees the upstream emitter
  # produced from ONE target-neutral source manifest, plus that binary's own
  # emitter strings. They are declarations of what each runtime CAN CARRY — not a
  # promise that we emit to all of them yet.
  # ─────────────────────────────────────────────────────────────────────────────

  cursor:
    id: cursor
    description: >-
      Cursor. The one measured runtime whose hook events are camelCase, and the
      one whose emitted hooks carry NO payload-translation shim.
    evidence: >-
      Measured on the upstream export for this runtime. hooks.json is
      {"hooks": {...}, "version": 1} with eight camelCase events. Entries are a
      FLAT array of {command, type} with an optional sibling `matcher`, not
      Claude's {matcher, hooks:[]} grouping. Matcher values name tools joined by
      `|` and use "Shell", not "Bash". Hook scripts are pruned to what the
      declared hooks reach — 43 of 56 files, dropping notifications/ entirely.
      Agent frontmatter keeps name/description/memory, REWRITES model
      (`fable` -> `claude-fable-5-high`) and DROPS the tool allowlist. Rules land
      as .mdc with byte-identical content and no added frontmatter. No top-level
      instructions file exists in the emitted tree.
    placement:
      scope: project
      hook_file: .cursor/hooks.json
      skills_dir: .cursor/skills
      agents_dir: .cursor/agents
      rules_dir: .cursor/rules
      instructions_file: null
    # file_version: measured — the emitted file is {"hooks": {...}, "version": 1}
    # and the two grouped runtimes carry no version key at all.
    # `event_map` because this runtime does not just re-case the event names, it
    # RENAMES one. Measured by pairing the upstream emitter's own two outputs:
    # `dev-rules-reminder`, `secret-output-guardrail`, `simplify-gate` and
    # `usage-quota-cache-refresh` sit on `UserPromptSubmit` in its Claude tree and on
    # `beforeSubmitPrompt` here — same scripts, same kit, two spellings. Without the
    # entry the lane was dropped with the reason "the target declares no
    # userPromptSubmit event", which reads like a wall and is a rename.
    hook_format: {event_case: camel, nesting: flat, command_form: string,
                  root_env: null, file_version: 1,
                  event_map: {UserPromptSubmit: beforeSubmitPrompt}}
    events: [preToolUse, postToolUse, beforeSubmitPrompt, sessionStart, stop,
             subagentStart, subagentStop, preCompact]
    event_wildcard: {}
    # Measured from the upstream emitter's own cursor output: its matchers read
    # `Read|Write|Shell`, `Shell|Read`, `Task`, `Write`. So the tools exist — under
    # another name for one of them, which a raw comparison reports as absent.
    tool_atoms: [Shell, Read, Write, Task]
    tool_map: {Bash: Shell}
    # Measured: the upstream emitter writes .mdc here with byte-identical content and
    # adds no frontmatter, so the extension is the whole of the difference.
    rules: {extension: mdc}
    unsupported_atoms: [Workflow, Skill, Agent, NotebookRead, NotebookEdit]
    agents:
      named_registry: true
      role_format: md
      role_dir: agents
      required_keys: [name, description]
      keep_keys: [name, description, memory, model]
      tool_allowlist: false
      # Measured by pairing the upstream emitter's own two outputs: the runtime that
      # keeps the source tier verbatim gives the input, this one gives the output,
      # role by role. 16 roles carry a translated tier there; ours carried none,
      # because `model` was missing from keep_keys and the map could not be reached.
      model_tier_map: {fable: claude-fable-5-high,
                       opus: claude-opus-4-8-thinking-high,
                       sonnet: claude-sonnet-5-high,
                       haiku: composer-2.5-fast,
                       inherit: inherit}
    caveats:
      rule_attachment_unverified: >-
        This runtime's rule format documents a frontmatter that decides WHEN a rule
        attaches — always, on a glob, or on the model asking for it. Measured: the
        upstream emitter writes none, on any of its eight rule files, and ours writes
        none either, so the two exports stand or fall together. What none of that
        settles is whether a rule with no frontmatter attaches at all, which could
        not be probed without the runtime. Read the rules as material a human can
        point the model at, not as guidance that is loading itself.
      statusline_not_carried: >-
        The upstream ships a statusline renderer into this runtime — measured, 23
        JavaScript files across the three targets it does that for. Ours is not a
        renderer: it is a configuration file for a third-party statusline tool that
        only the home runtime runs. Carrying it here would mean writing a renderer in
        this runtime's own language and keeping it, which is the same cost as the
        hook bridge and buys a status bar. Nothing about the gates depends on it.
      no_payload_shim: >-
        The emitted hook scripts read `data.tool_input` / `data.tool_name` — the
        Claude snake_case vocabulary — and nothing in the emitted tree translates
        into it. Either the runtime already speaks that shape, or every gate
        fail-opens silently. NOT MEASURED against a live runtime; do not emit a
        compliance gate here until it is.

  grok:
    id: grok
    description: >-
      Grok. Claude's event vocabulary, its own workspace root variable, and a
      real runtime shim that translates the payload before each hook runs.
    evidence: >-
      Measured on the upstream export for this runtime. Native hook file is
      .grok/hooks/engineer.json — {"hooks": {...}} with the eight PascalCase
      Claude events and Claude's {matcher, hooks:[]} grouping. Every command is
      one string rooted at ${GROK_WORKSPACE_ROOT}; ${CLAUDE_PLUGIN_ROOT} does not
      survive into it. The upstream envelope shim translates camelCase to
      snake_case, `pre_tool_use` to `PreToolUse`, and tool names
      (run_terminal_command->Bash, read_file->Read, search_replace->Edit,
      grep->Grep, list_dir->Glob, web_search->WebSearch,
      spawn_subagent->Task), and restores the `mcp__` prefix Grok drops. The
      binary states it also rewrites the matcher at build time: "a rule keeping
      Claude's mcp__ prefix never matches on Grok". Hook scripts are mirrored
      whole (56/56), not pruned. Agent frontmatter DROPS both model and tools.
    placement:
      scope: project
      hook_file: .grok/hooks/engineer.json
      skills_dir: .grok/skills
      agents_dir: .grok/agents
      rules_dir: .grok/rules
      instructions_file: null
    hook_format: {event_case: pascal, nesting: grouped, command_form: string,
                  root_env: GROK_WORKSPACE_ROOT}
    # What this runtime SENDS. Read from the upstream shim's own source
    # (the upstream envelope shim), not paraphrased: it delivers camelCase
    # keys, snake_case event values and its own tool vocabulary, while every gate
    # here reads tool_name / tool_input / hook_event_name. Untranslated, each gate
    # finds nothing and blocks nothing while the install reports it as carried.
    payload_dialect:
      event_value_case: snake_to_pascal
      # A UNION, not a rename: anything reading the runtime's own spelling keeps
      # working, and an alias is never written over a key that is already there.
      field_map:
        hookEventName: hook_event_name
        sessionId: session_id
        toolName: tool_name
        toolInput: tool_input
        toolResult: tool_response
        toolUseId: tool_use_id
        toolInputTruncated: tool_input_truncated
        permissionMode: permission_mode
        workspaceRoot: workspace_root
        stopHookActive: stop_hook_active
        lastAssistantMessage: last_assistant_message
        errorDetails: error_details
        backgroundTasks: background_tasks
        sessionCrons: session_crons
      # Lossy in this direction and deliberately so: Edit/Write/MultiEdit all
      # arrive as search_replace, and Edit is chosen because the gates treat them
      # alike; Glob/LS both arrive as list_dir, and Glob for the same reason.
      tool_names: {run_terminal_command: Bash, read_file: Read,
                   search_replace: Edit, grep: Grep, list_dir: Glob,
                   web_search: WebSearch, spawn_subagent: Task}
      # This runtime names an MCP tool `server__tool`; the gates compare against
      # `mcp__server__tool`. Every built-in above is a single-underscore name, so a
      # double-underscore name that is not one of them is an MCP tool.
      mcp_prefix_restore: true
      # A PreToolUse denial: this runtime reads a decision object on stdout, where
      # the home runtime reads permissionDecision. A denial in the wrong shape is a
      # denial that does not happen.
      deny: {stdout_key: decision, stdout_value: deny, reason_key: reason,
             events: [PreToolUse]}
    events: [PreToolUse, PostToolUse, UserPromptSubmit, SessionStart, Stop,
             SubagentStart, SubagentStop, PreCompact]
    event_wildcard: {}
    tool_atoms: [Bash, Read, Edit, Grep, Glob, WebSearch, Task]
    agents:
      named_registry: true
      role_format: md
      role_dir: agents
      required_keys: [name, description]
      keep_keys: [name, description, memory]
      tool_allowlist: false
      model_tier_map: {}
    caveats:
      statusline_not_carried: >-
        The upstream ships a statusline renderer into this runtime — measured, 23
        JavaScript files across the three targets it does that for. Ours is not a
        renderer: it is a configuration file for a third-party statusline tool that
        only the home runtime runs. Carrying it here would mean writing a renderer in
        this runtime's own language and keeping it, which is the same cost as the
        hook bridge and buys a status bar. Nothing about the gates depends on it.
      mcp_matcher_form: >-
        Grok names an MCP tool `server__tool`. A matcher carrying Claude's
        `mcp__` prefix never matches, so a matcher must be rewritten at emit
        time — the shim only repairs the PAYLOAD, not the matcher.

  pi:
    id: pi
    description: >-
      Pi. Registers hooks as an extension, and is the one measured runtime that
      silently carries FEWER events than the source declares.
    evidence: >-
      Measured on the upstream export for this runtime. Hook file is
      .pi/extensions/<upstream-extension>/hooks.json — {"version": 1, "hooks":
      {...}} with SIX PascalCase events; SubagentStart and SubagentStop are
      absent and their backing scripts were not copied into the extension at all.
      Matcher is an ARRAY of strings, not a `|`-joined regex. Commands are argv:
      {command: "node", args: [...]} with an explicit failureMode of open or
      closed. A sibling runtime marker beside it declares {"schemaVersion":
      1, "runtime": "pi"}. Skill `name:` is rewritten colon to hyphen (the
      binary: "skill frontmatter name must match emitted directory"); agents are
      renamed <kit>-<stem>.md and their tool lists rewritten to a lowercase
      primitive set (read/write/edit/bash/grep/find/ls) with model dropped.
    placement:
      scope: project
      # NOT the hooks.json inside the upstream extension directory. That path was
      # measured as a hook file and is not one: it is the private configuration of
      # the upstream tool's own extension, validated by that extension before pi
      # sees anything. See caveats.hook_surface_is_a_module.
      hook_file: null
      # A DIFFERENT kind of artifact from hook_file: not a translated registration
      # list, a generated JS extension module (render_hook_bridge) that shells out
      # to the same Python dispatcher every native hook_file target already calls,
      # via node:child_process.spawn (NOT the runtime's pi.exec helper — measured
      # to hardcode stdio with no stdin passthrough, see caveats.hook_surface_is_a_module
      # for the measurement this is built on).
      hook_bridge_file: .pi/extensions/hs-bridge/index.ts
      skills_dir: .pi/skills
      agents_dir: .pi/agents
      rules_dir: .pi/rules
      instructions_file: null
    # event_map only: PreToolUse is the one event this bridge covers today (the
    # blocking gates the runtime's own tool_call event supports). `events` below
    # names pi's OWN spelling, per runtime_event_name()'s contract.
    hook_format: {event_map: {PreToolUse: tool_call}}
    # `tool_call` is pi's own name for what we call PreToolUse (event_map above) —
    # the one event the generated bridge covers today. The other five events the
    # upstream bridge serves are recorded in `evidence`, where they describe that
    # tool's own extension, not an emission of ours; adding them here before the
    # bridge covers them would register a route the generator never wires.
    events:
      - tool_call
    event_wildcard: {}
    # pi's runtime knows seven lowercase primitives. Our matchers name Claude's
    # tools, and comparing the two raw drops every file and shell gate on a runtime
    # that has all of them.
    tool_atoms: [read, write, edit, bash, grep, find, ls]
    tool_map: {Bash: bash, Read: read, Write: write, Edit: edit, MultiEdit: edit,
               Grep: grep, Glob: find, LS: ls}
    unsupported_atoms: [Workflow, Skill, Agent, Task, NotebookRead, NotebookEdit]
    skills: {name_rewrite: colon_to_dash}
    agents:
      named_registry: true
      role_format: md
      role_dir: agents
      required_keys: [name, description]
      keep_keys: [name, description, memory, tools]
      tool_allowlist: true
      # Measured: pi's runtime knows seven primitives and nothing else. A Claude tool
      # name written here is a line the loader ignores, so the allowlist is mapped and
      # anything unmappable is reported rather than carried as decoration.
      tool_map: {Read: read, Write: write, Edit: edit, MultiEdit: edit, Bash: bash,
                 Grep: grep, Glob: find, LS: ls}
      model_tier_map: {}
    caveats:
      statusline_not_carried: >-
        The upstream ships a statusline renderer into this runtime — measured, 23
        JavaScript files across the three targets it does that for. Ours is not a
        renderer: it is a configuration file for a third-party statusline tool that
        only the home runtime runs. Carrying it here would mean writing a renderer in
        this runtime's own language and keeping it, which is the same cost as the
        hook bridge and buys a status bar. Nothing about the gates depends on it.
      dropped_events: >-
        SubagentStart and SubagentStop are not registrable here. Any gate that
        depends on a subagent boundary has no counterpart and must be refused
        rather than silently omitted.
      hook_surface_is_a_module: >-
        This runtime takes hooks only from a JavaScript extension module — a file
        exporting `default function (pi)` that calls `pi.on("tool_call", ...)` and
        returns {block, reason} — measured in the upstream extension's index.ts.
        A JSON file cannot register a Python dispatcher there. The upstream tool's
        own hooks.json is that tool's private config: its validator requires the
        literal command "node", an args tuple pointing inside its own directory,
        and a handler id from a frozen list of its script names. Writing ours there
        is worse than useless — that extension answers a rejected config by
        blocking every tool call — so nothing of ours is written to it.
        BUILT: this was a cost refusal, not a platform wall, and the cost has been
        paid. Python is reachable here only through a JS shim, never directly —
        `placement.hook_bridge_file` names that shim, a GENERATED TypeScript module
        (render_hook_bridge in target_projection.py) that registers `pi.on
        ("tool_call", ...)` itself and shells out to the SAME Python dispatcher
        every hook_file target calls. It spawns via `node:child_process.spawn`
        directly, NOT the runtime's own `pi.exec` helper — live-probed against the
        real installed package (pi 0.84.3, dist/core/exec.js): `pi.exec`'s options
        hardcode `stdio: ["ignore", "pipe", "pipe"]` with no stdin/env
        passthrough, so a payload handed to it never reaches the child. Extensions
        are plain Node, not sandboxed away from its builtins, and the upstream
        tool's own hooks extension (index.ts:352,417, `child.stdin.end(encoded
        Payload)`) imports `node:child_process` directly and pipes its own hook
        payload the same way, for the exact same reason — an established,
        reachable path, not a guess. The routing table the bridge embeds is
        derived from `projection.decisions`, never hand-listed, so it cannot
        silently disagree with what the projection says survives.
        Bash/Read/Write/Edit compliance gates (bash_safety_guard, privacy_read_
        guard, write_guard, and friends) route through it and actually fire —
        confirmed by running the generated module under a real `node` process
        with a stub matching pi's documented ExtensionAPI, which returns the
        real bash_safety_guard block reason for a dangerous command and leaves
        an innocuous one untouched (test_pi_hook_bridge.py::
        TestTheBridgeActuallyRunsUnderNode). Agent|Task, Workflow and Skill still
        refuse because pi genuinely has no tool for them to gate — narrower, not
        gateless. `--allow-inert-gates` is still required to emit for that reason
        alone, not for the whole runtime.
        The size of the upstream's own equivalent was measured rather than
        guessed, for scale: 1443 lines of TypeScript beside 12 handler scripts,
        implementing the payload bridge, matcher semantics, failure modes,
        statusline and an ask-user tool itself. The bridge here is intentionally
        far smaller — it does not reimplement any of that, it only routes into
        the dispatcher our other targets already run.

  omp:
    id: omp
    description: >-
      Omp. Takes skills, agents and rules verbatim, and takes no hooks at all.
    evidence: >-
      The upstream export for this runtime contains exactly three
      directories — agents, skills, rules. `find .omp -iname "*hook*"` returns no
      hook manifest. Agents are byte-identical to source INCLUDING model and the
      full Claude tool syntax; skills are byte-identical, colon in the name and all
      colon form preserved. The eight rules are additionally concatenated into a
      project AGENTS.md between its own START/END sentinels.
    placement:
      scope: project
      hook_file: null
      skills_dir: .omp/skills
      agents_dir: .omp/agents
      rules_dir: .omp/rules
      instructions_file: AGENTS.md
    # The one measured runtime whose instructions file also carries the rules inline.
    # The other tool wraps its own copy in its own START/END markers; ours carries the harness
    # marker instead, so both tools can own a block in the same file without either
    # deleting the other's.
    instructions_merge: {rules_inline: true}
    agents:
      named_registry: true
      role_format: md
      role_dir: agents
      required_keys: [name, description]
      # Measured byte-identical to source, model and the full Claude tool syntax
      # included — the one runtime where a role travels whole.
      keep_keys: [name, description, memory, model, tools]
      tool_allowlist: true
      model_tier_map: passthrough
    caveats:
      no_hooks: >-
        No hook surface was found. Every compliance gate is unrepresentable here,
        so this target carries instructions and inventory only — an install that
        claimed gate coverage would be claiming something with nowhere to run.

  agy:
    id: agy
    description: >-
      Antigravity / Gemini CLI. Global-only: skills and agents land in the user's
      home, and nothing is emitted at project scope.
    evidence: >-
      Measured on the upstream export for this runtime plus the home it wrote. Skills
      are dual-written to ~/.gemini/config/skills and
      ~/.gemini/antigravity-cli/skills, byte-identical to source (diff -rq clean,
      106 dirs each); agents to ~/.gemini/config/agents (16 .md). The emitter
      states: "workspace .agents/skills not emitted" and skips schemas, scripts
      and statusline as "global-only skills/agents; no MCP/hooks/project emit".
      No hook file exists anywhere in the tree. Agent `model:` is stripped for
      every Claude catalog id and only `inherit` survives; a routing comment is
      appended naming `agy --sandbox --model <id> --agent <name>`.
    placement:
      scope: global
      hook_file: null
      skills_dir: ~/.gemini/config/skills
      skills_dir_secondary: ~/.gemini/antigravity-cli/skills
      agents_dir: ~/.gemini/config/agents
      instructions_file: null
    agents:
      named_registry: true
      role_format: md
      role_dir: agents
      required_keys: [name, description]
      # `model` IS read here — measured, the one source agent already set to
      # `inherit` kept its line while every Claude tier was stripped. Keeping the key
      # and filtering the VALUE is what makes that safe; leaving the key out would
      # make the filter dead code that a mutation cannot reach.
      keep_keys: [name, description, memory, model, tools]
      tool_allowlist: true
      # `inherit` is the only model value this runtime has. A Claude tier written here
      # would read as the bound having been honoured by a name it never knew.
      model_values: [inherit]
      model_tier_map: {}
    caveats:
      global_only: >-
        Writing here changes every project the user owns from inside one of them.
        This target must never be installed without the user saying so for that
        specific machine.
      no_hooks: >-
        No hook surface. Gate coverage is zero and must be reported as zero.
      model_catalog_carried_unverified: >-
        CARRIED, NOT PROBED BY US — the earlier refusal here has been overruled on
        explicit instruction, on the grounds that the source tool is production-grade
        for this one fact. The rule this export actually enforces on a role file is
        still self-measured (`model_tier_map` above: only `inherit` survives); this
        paragraph is a DIFFERENT thing — routing advice for a human or orchestrator
        invoking the runtime directly at its CLI, reproduced from that tool's own
        documentation rather than read off our own binary. Live model IDs (from that
        tool's own `agy models` listing): gemini-3.7-flash-high,
        gemini-3.7-flash-medium, gemini-3.7-flash-low, gemini-3.6-flash-high,
        gemini-3.6-flash-medium, gemini-3.6-flash-low, gemini-3.5-flash-high,
        gemini-3.5-flash-medium, gemini-3.5-flash-low, gemini-3.1-pro-high,
        gemini-3.1-pro-low, claude-sonnet-4-6, claude-opus-4-6-thinking,
        gpt-oss-120b-medium. Suggested routing by role: explore/scout/research ->
        a low or medium flash tier; tester/docs -> a medium flash tier;
        planner/coder/debugger -> a high flash tier or claude-sonnet-4-6;
        reviewer -> claude-sonnet-4-6 or a high flash tier; highest-stakes ->
        claude-opus-4-6-thinking. Invocation shape: `agy --sandbox --model <id>
        -p "…"` (flag order matters — `-p` last). PROBE BEFORE TRUSTING: none of this
        has been run against the real binary from this side; verify the catalog and
        the flag shape before an orchestrator depends on either.

  dsh:
    id: dsh
    description: >-
      Dsh. Skills are native; everything else is preserved on disk but inert.
    evidence: >-
      Measured on the upstream export for this runtime. Its ownership index records a `class` of
      "native" or "sidecar" per file: skills native (1568 files across 106
      dirs), and agents 16, hooks 44, rules 8, scripts 5, output-styles 6,
      schemas 1, statusline 1 all "sidecar" — 81, matching the source's non-skill
      totals exactly. Every SKILL.md is rewritten in exactly two places:
      a colon in the frontmatter name to a hyphen, and `when_to_use:` to `whenToUse:`. The
      binary: "dsh: %s export sidecar-preserved; no active native DSH
      projection". Home resolves through DSH_HOME.
    placement:
      scope: global
      hook_file: null
      skills_dir: .dsh/skills
      agents_dir: null
      instructions_file: null
      home_env: DSH_HOME
    skills: {name_rewrite: colon_to_dash, key_rewrite: {when_to_use: whenToUse}}
    agents:
      # Measured: agent files are copied and NONE is activated — the ownership index
      # classes every one of them "sidecar". So they travel labelled rather than
      # either dropped (which loses a human's porting material) or written live
      # (which reports an install this runtime never performs).
      named_registry: false
      inert_sidecar: true
      role_format: md
      role_dir: harness-sidecar/agents
      required_keys: [name, description]
      keep_keys: [name, description, memory, model, tools]
      tool_allowlist: true
      model_tier_map: passthrough
    caveats:
      skills_only: >-
        Agents and hooks are copied but inert. An install here delivers the skill
        catalog and nothing enforceable; saying otherwise would describe a cage
        that is only a drawing of one.
      agents_md_merge_untested: >-
        The binary contains a rules-into-AGENTS.md merge path with its own
        refusal and sentinel handling, which this emission did not exercise
        because no target AGENTS.md existed. Not measured, not absent.

  portable:
    id: portable
    description: >-
      Export-only. No install mode; a human copies what they want.
    evidence: >-
      Measured on the upstream export for this runtime. Its own marker file
      states "Nothing in this export installs itself." Skills are first-class
      (106) with `allowed-tools:` DROPPED outright and named model literals
      rewritten to "a configured model tier"; the eight rules are merged into
      AGENTS.md with no standalone files. Agents (16) and hooks (44) sit under
      its own sidecar directory byte-verbatim, and that directory's own notes call them "inert, NOT
      active".
    placement:
      scope: project
      hook_file: null
      skills_dir: skills
      agents_dir: null
      instructions_file: AGENTS.md
    # Measured on the upstream export: 0 of its skills carry `allowed-tools`, and
    # every SKILL.md opens with a banner saying the export is best-effort and the
    # prose below may still describe the runtime it was written for. The banner
    # travels IN the file because that target's whole purpose is hand-copying, and a
    # file copied out of the export otherwise carries no sign it was rewritten.
    skills:
      drop_keys: [allowed-tools]
      notice: >-
        Exported by the harness for a runtime it was not written for. The
        frontmatter tool surface was removed and no model is prescribed; the prose
        below may still describe another runtime's behaviour — map it to yours.
        Nothing in this export installs itself.
    agents:
      # Same shape as dsh and for the same measured reason: the export's own NOTES.md
      # calls the copied agents and hooks "inert, NOT active".
      named_registry: false
      inert_sidecar: true
      role_format: md
      role_dir: harness-sidecar/agents
      required_keys: [name, description]
      keep_keys: [name, description, memory, model, tools]
      tool_allowlist: true
      model_tier_map: passthrough
    caveats:
      not_an_install: >-
        This target produces a directory for a human to read and copy. Reporting
        it as an install would claim a runtime that is not there.
      lossy_model_rewrite: >-
        The upstream rewrite collapses distinct tiers onto one phrase inside the
        skill PROSE, so "fable (e.g. opus, sonnet, haiku)" becomes four copies of
        the same placeholder. The harness declines that rewrite outright: it edits
        frontmatter only, because a body rewritten for a runtime is a body that
        starts inventing. Tiers on a ROLE are mapped or left alone, never flattened.
