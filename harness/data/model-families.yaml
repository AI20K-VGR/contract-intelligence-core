# model-families.yaml — which model FAMILY is driving, for pitching prose (human-edited).
#
# NOT a ranking. The haiku<sonnet<opus<fable ladder lives in model_policy._TIER_RANK and
# answers a different question — whether a spawn clears a declared ceiling. A model absent
# from that ladder classifies as None ON PURPOSE, and `evaluate()` reads that None as
# fail-open so a custom model is never false-blocked. Nothing here feeds that path.
#
# What this answers: a skill body written thin for a frontier model leans on inference the
# way a contract leans on a reader who knows the domain. A second-tier model does better
# pointed at the step-by-step reference than asked to infer it. This table is how the
# harness knows which of those two readers it is talking to.
#
# ── PATTERNS, NEVER VERSIONS ──────────────────────────────────────────────────────────
# `minimax-m2` becomes `minimax-m3`; `glm-4.6` becomes `glm-5`. A table of exact ids is
# stale the week it ships and fails SILENTLY: an unmatched id looks exactly like a
# frontier model, so the fallback quietly stops applying instead of erroring. Every
# pattern below therefore matches a FAMILY NAME and stops there — no version digits, no
# date suffix. Matching is substring, case-insensitive, on the normalised id (a trailing
# `[..]` tag such as `[1m]` is stripped before comparison).
#
# ── HOW TO ADD YOUR OWN ───────────────────────────────────────────────────────────────
# Add the family name a provider puts in front of its version — `minimax` for
# `minimax-m2`, `glm` for `glm-4.6`. Test it: any later version of that family must still
# match without a second edit. If you find yourself typing a digit, the pattern is wrong.
#
# Point HARNESS_MODEL_FAMILIES at a copy of this file to override it for one project or
# one lane. A missing or corrupt file degrades to "unknown family" — never an exception
# into a hook, and never a silent switch into either mode.
#
# ── DECLARING IT OUTRIGHT (overrides everything below) ────────────────────────────────
#   HARNESS_MODEL_TIER=2   this session is second-tier — load the reference layer
#   HARNESS_MODEL_TIER=1   this session is frontier — keep the thin bodies
#
# Reach for it when the id is not the truth: a proxy or gateway that rewrites the model
# name, an internal alias, a router whose id says nothing about what actually answers. It
# wins in BOTH directions — including forcing `1` on an id that matches a second-tier
# pattern — because the operator knows something the string does not say. Put it in
# `.claude/settings.local.json` under `env` for a whole project, or export it for one lane:
#
#     "env": { "HARNESS_MODEL_TIER": "2" }
#
# A value other than `1` or `2` is IGNORED, not honoured: a typo must not silently switch
# every session to "unknown" and disable the table underneath.

schema_version: 1

# Families whose prose does better with the step-by-step reference loaded. Everything not
# listed is UNKNOWN, which is deliberately NOT the same as frontier: an unrecognised id
# opts into neither mode, so a typo or a new vendor never silently changes how the harness
# writes.
second_tier:
  - minimax
  - glm          # Zhipu / Z.ai
  - deepseek
  - kimi         # Moonshot
  - qwen         # Alibaba
  - yi           # 01.AI
  - ernie        # Baidu
  - hunyuan      # Tencent
  - doubao       # ByteDance
  - baichuan
  - internlm
  - spark        # iFlytek

# First-party families. Listed so the counter-control can assert they are NOT second-tier,
# and so an operator reading this file sees both sides of the split rather than inferring
# one from the absence of the other.
frontier:
  - claude
  - opus
  - sonnet
  - haiku
  - fable
