# advisor-audit.yaml — SSOT thresholds/weights for harness/scripts/advisor_audit.py.
#
# advisor_audit.py is a deterministic, ADVISORY drift-review scanner over the Advisor's
# (hs:escalation-consultant) verdict sidecar log. It never blocks (no exit-2) and never
# hardcodes a threshold/weight in the .py — every number lives here so a maintainer can
# retune drift sensitivity without touching code (mirrors the tier-SSOT float discipline
# used elsewhere in the harness).
#
# Ported from FrankCode's advisor-audit.md QA methodology (weekly drift review). The
# harness has no cron here — invoke by hand or wire it to whichever skill/hook triggers
# it later; this file only configures the reader, it does not schedule it.

# Path to the append-only JSONL sidecar the Advisor's verdicts are logged to. Relative
# paths resolve against the repo root. Upstream writer (logging hs:escalation-consultant
# verdicts) is a separate follow-up — this reader is graceful on an absent/empty file.
sink_path: state/audit/advisor-verdicts.jsonl

# Rolling window (days) a record must fall within to count toward repeat-prompt/drift
# signals. A record with no parseable ts is treated as in-window (lenient, not dropped).
window_days: 7

thresholds:
  # override-rate per call_site above this fraction -> flag (caller consistently
  # overrides/re-asks -- the Advisor is asking the wrong question, or is not trusted).
  override_rate: 0.20
  # malformed-verdict rate above this fraction -> flag (prompt drift, or a wiring/budget
  # failure -- see MALFORMED_PREFIXES in advisor_audit.py).
  malformed_rate: 0.05
  # an inputs_hash repeated at least this many times in the window -> repeat-prompt flag.
  repeat_prompt: 3
  # a call_site's drift_score more than this many standard deviations above the current
  # window's per-call_site mean -> escalate to the maintainer (human), never to the
  # Advisor itself (zero self-review -- see anti-patterns in the source methodology).
  sigma: 3

# drift_score(call_site) = override_rate*override + flipped_pct*flipped
#                        + malformed_rate*malformed + repeat_rate*repeat
weights:
  override: 3
  flipped: 5
  malformed: 2
  repeat: 1

# Which confidence interval accompanies every reported rate, and at what level.
# A rate without an interval is a point estimate wearing the clothes of a finding:
# measured on this very audit, `override_high` fired on 1 override out of 2 calls
# (rate 0.500, Wilson 95% [0.095, 0.905]) in the same table cell as a 60-of-200
# result. The engine is harness/scripts/wilson.py.
#
#   wilson           default; the primary number, good behaviour at small n
#   wilson-cc        continuity-corrected; wider, the conservative reading
#   clopper-pearson  exact; guarantees >= conf coverage at the cost of width
#   jeffreys         Bayesian-flavoured middle, shortest of the four
#
# An unknown method is REFUSED, not defaulted: answering with wilson under a name
# the operator typed would be a wrong answer rather than a degraded one.
interval:
  method: wilson
  conf: 0.95
