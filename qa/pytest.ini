[pytest]
testpaths = smoke security performance e2e
addopts = -ra --strict-markers
markers =
    smoke: stack is up and the critical paths answer (fast, read-only)
    security: authn/authz/tenant/input/transport checks against the running stack
    perf: latency and throughput budgets under concurrent load
    e2e: full upload -> AI1 OCR -> AI2 -> PENDING_REVIEW pipeline (opt-in, QA_RUN_PIPELINE=1)
    static: checks on repo config files, no network needed
