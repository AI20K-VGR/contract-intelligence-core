# Dashboards are code: loaded from infra/monitoring/grafana/dashboards and not
# editable or deletable in the UI. Change the JSON in git instead.
apiVersion: 1

providers:
  - name: contract-intelligence
    orgId: 1
    folder: Contract Intelligence
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
