[project]
name = "contract-intelligence-backend"
version = "0.1.0"
description = "Backend API for Contract Intelligence - OCR/IDP/Citation/Conflict/HITL pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "VSF OJT Batch 3 - Backend Engineer" },
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "minio>=7.2.0",
    "httpx>=0.27.0",
    "python-ulid>=3.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "structlog>=24.1.0",
    # Auth
    "PyJWT[crypto]>=2.8.0",
    "passlib[argon2]>=1.7.4",
    "aiofiles>=24.1.0",   # Async file I/O cho LocalFileStorage (runtime dep)
    "aiokafka>=0.14.0",
    "aioboto3>=15.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "import-linter>=2.0",
    "mypy>=1.10.0",
    "types-python-dateutil>=2.9.0",
    "types-aiofiles>=24.1.0",  # Type stubs cho aiofiles (mypy strict)
    "aiosqlite>=0.20.0",  # Integration tests (SQLite in-memory)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_intelligence"]

# -----------------------------------------------------------------------------
# Ruff — linter + formatter
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

# Lint settings (ruff 0.8+ format)
[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (unused imports)
    "I",     # isort (import order)
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "C4",    # flake8-comprehensions
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
]
ignore = [
    # Stub/base code - các rule này không phù hợp
    "TC001",  # Move application import into TYPE_CHECKING block
    "TC002",  # Move third-party import into TYPE_CHECKING block
    "TC003",  # Move stdlib import into TYPE_CHECKING block
    "ARG001", # Unused function argument (stub functions)
    "ARG005", # Unused function argument (stub functions)
    "PLR0913",  # too many arguments (DTOs)
    "PLR2004",  # magic value (used in tests)
    "N818",     # Exception naming (DomainException is acceptable)
    "B008",     # Body(...) in default - common in FastAPI stubs
]

# isort settings
[tool.ruff.lint.isort]
known-first-party = ["contract_intelligence", "shared"]
combine-as-imports = true

# Note: banned-api da duoc loai bo trong ruff 0.8+
# Su dung import-linter thay the de chan import framework trong domain layer

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------------------------------------------------------------
# MyPy — strict type checking
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "minio.*",
    "alembic.*",
    "passlib.*",
    "aiokafka.*",
    "aioboto3.*",
    "aiobotocore.*",
    "botocore.*",
    "boto3.*",
]
ignore_missing_imports = true

# FastAPI router return types — chấp nhận untyped dict/list trong response models
# vì API contract linh hoạt (OpenAPI generation tự handle). Domain logic vẫn strict.
[[tool.mypy.overrides]]
module = [
    "contract_intelligence.contract.interfaces.api.routers.*",
    "contract_intelligence.extraction.interfaces.api.routers.*",
    "contract_intelligence.conflict.interfaces.api.routers.*",
    "contract_intelligence.review.interfaces.api.routers.*",
    "contract_intelligence.shared.ai.dispatcher",
]
disallow_any_explicit = false

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests (no DB)",
    "integration: integration tests (needs DB)",
    "architecture: architecture conformance tests",
]

# -----------------------------------------------------------------------------
# Coverage
# -----------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/contract_intelligence"]
omit = [
    "*/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 70
