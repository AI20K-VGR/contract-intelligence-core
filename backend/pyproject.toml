[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contract-intelligence"
version = "0.1.0"
description = "Contract Intelligence modular monolith and durable worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2", "pymupdf>=1.26,<2", "pytesseract>=0.3.13,<1",
  "pillow>=11,<13", "prometheus-client>=0.21,<1", "openai>=1.50,<2", "mistralai>=2.0,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
