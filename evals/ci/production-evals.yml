name: AI2 Production Evals

on:
  push:
    branches: [main, master]
    paths:
      - "ai-service/**"
      - "evals/**"
  pull_request:
    branches: [main, master]
    paths:
      - "ai-service/**"
      - "evals/**"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service dependencies
        run: python -m pip install -r ai-service/requirements.txt
      - name: Run service unit tests
        working-directory: ai-service
        run: python -m pytest -q tests

  eval-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service dependencies
        run: python -m pip install -r ai-service/requirements.txt
      - name: Run AI2 eval contract tests
        run: >-
          python -m pytest -q
          --import-mode=importlib
          evals/eval_types/ai2_contract_package/tests
          evals/eval_types/ai2_grounded_query/tests

  production-evals:
    runs-on: ubuntu-latest
    needs: [unit-tests, eval-contract-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service dependencies
        run: python -m pip install -r ai-service/requirements.txt
      - name: Run deterministic AI2 production evals
        run: >-
          python evals/scripts/run_production_evals.py
          --sample-dir evals/data/samples/ai2_contract_package
          --ground-truth evals/eval_types/ai2_contract_package/tests/production_fixtures/ground_truth.json
          && python evals/scripts/run_grounded_query_evals.py
          --sample-dir evals/data/samples/ai2_grounded_query
          --ground-truth evals/eval_types/ai2_grounded_query/tests/production_fixtures/ground_truth.json
